<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc">
<title id="title">AgentVault logical architecture</title>
<desc id="desc">A focused view of management UI, AuthGuard entry, Payer and Payee processing, authoritative SQL, and external settlement. Connections use consecutive numbers; letter suffixes identify parallel branches.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8abce5"/></marker><linearGradient id="backdrop" x2="1" y2="1"><stop stop-color="#06111f"/><stop offset="1" stop-color="#101b31"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#20354b" stroke-opacity="0.22" stroke-width="0.6"/></pattern></defs>
<style>text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#e8f3ff}.title{font-size:32px;font-weight:750}.subtitle{font-size:18px;fill:#9ab3cf}.zone-title{font-size:22px;font-weight:700}.card-title{font-weight:700}.body{font-size:17px;fill:#b9cde3}.note{fill:#9ab3cf}.call-label{font-size:16px;fill:#d3eaff}.edge{fill:none;stroke:#8abce5;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}</style>
<rect width="1600" height="1140" fill="url(#backdrop)"/><rect width="1600" height="1140" fill="url(#grid)"/>
<text x="40" y="58" class="title">AgentVault | Logical architecture</text>
<text x="40" y="92" class="subtitle">Policy-controlled payments. Trusted settlement. Authoritative accounting.</text>
<path d="M40 110H1560" stroke="#2dd4bf" stroke-opacity="0.25"/>
<g id="boundaries"><g id="ui" data-boundary="ui"><rect x="40" y="135" width="440" height="220" rx="14" fill="#0a2529" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="7 5"/></g><g id="authguard" data-boundary="authguard"><rect x="520" y="135" width="1040" height="220" rx="14" fill="#201735" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="7 5"/></g><g id="applications" data-boundary="applications"><rect x="40" y="405" width="440" height="550" rx="14" fill="#111e30" stroke="#647f9d" stroke-width="1.5" stroke-dasharray="7 5"/></g><g id="payment-core" data-boundary="payment-core"><rect x="520" y="405" width="650" height="550" rx="14" fill="#0d213c" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="7 5"/></g><g id="settlement" data-boundary="settlement"><rect x="1210" y="405" width="350" height="550" rx="14" fill="#2b2118" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="7 5"/></g></g><g id="connections"><path class="edge" data-call="1" d="M 260 645 L 260 755"/><path class="edge" data-call="2a" d="M 460 250 L 540 250"/><path class="edge" data-call="2b" d="M 460 550 L 493 550 L 493 285 L 540 285"/><path class="edge" data-call="2c" d="M 460 840 L 507 840 L 507 303 L 540 303"/><path class="edge" data-call="3" d="M 1000 250 L 1040 250"/><path class="edge" data-call="4" d="M 770 310 L 770 380 L 940 380 L 940 405"/><path class="edge" data-call="5" d="M 1170 665 L 1190 665 L 1190 790 L 1230 790"/><path class="edge" data-call="6" d="M 1170 555 L 1230 555"/><path class="edge" data-call="7" d="M 1385 630 L 1385 710"/><path class="edge" data-call="8" d="M 1080 775 L 1080 810"/></g><g id="components-and-labels"><text x="60" y="166" class="zone-title">Browser / application UI</text><g id="dashboard" data-component="dashboard" data-box="60,185,400,150"><rect x="60" y="185" width="400" height="150" rx="10" fill="#0c1b2c" stroke="#2dd4bf" stroke-width="1.3"/><text x="77" y="216" class="card-title" style="font-size:21px">Payment operations</text><text x="77" y="247" class="body">Payer / Payee Transactions · Approvals</text><text x="77" y="272" class="body">Balances &amp; Ledger · Clients</text><text x="77" y="297" class="body">Scenarios · Wallets</text></g><text x="540" y="166" class="zone-title">AuthGuard access boundary</text><g id="gateway" data-component="gateway" data-box="540,195,460,115"><rect x="540" y="195" width="460" height="115" rx="10" fill="#0c1b2c" stroke="#a78bfa" stroke-width="1.3"/><text x="557" y="226" class="card-title" style="font-size:21px">Envoy Gateway</text><text x="557" y="257" class="body">Routes all protected APIs</text><text x="557" y="282" class="body">Forwards trusted principal context</text></g><g id="identity" data-component="identity" data-box="1040,195,500,115"><rect x="1040" y="195" width="500" height="115" rx="10" fill="#0c1b2c" stroke="#a78bfa" stroke-width="1.3"/><text x="1057" y="226" class="card-title" style="font-size:21px">AuthGuard</text><text x="1057" y="257" class="body">Identity and access policy</text><text x="1057" y="282" class="body">Authentication / authorization</text></g><text x="60" y="436" class="zone-title">Business applications</text><g id="payer-sdk" data-component="payer-sdk" data-box="60,465,400,180"><rect x="60" y="465" width="400" height="180" rx="10" fill="#0c1b2c" stroke="#647f9d" stroke-width="1.3"/><text x="77" y="496" class="card-title" style="font-size:20px">Business client + Payer SDK</text><text x="77" y="527" class="body">Calls a paid HTTP / MCP / A2A resource</text><text x="77" y="552" class="body">Captures 402 · requests authorization</text><text x="77" y="577" class="body">Retries with the payment Credential</text></g><g id="payee-sdk" data-component="payee-sdk" data-box="60,755,400,170"><rect x="60" y="755" width="400" height="170" rx="10" fill="#0c1b2c" stroke="#647f9d" stroke-width="1.3"/><text x="77" y="786" class="card-title" style="font-size:20px">Resource service + Payee SDK</text><text x="77" y="817" class="body">Quotes and collects payment</text><text x="77" y="842" class="body">Releases the resource after settlement</text><text x="77" y="867" class="body">Owns business delivery and task state</text></g><text x="540" y="436" class="zone-title">AgentVault payment core</text><g id="payer" data-component="payer" data-box="540,465,280,220"><rect x="540" y="465" width="280" height="220" rx="10" fill="#0c1b2c" stroke="#60a5fa" stroke-width="1.3"/><text x="557" y="496" class="card-title" style="font-size:21px">Payer</text><text x="557" y="527" class="body">Policy / wallet selection</text><text x="557" y="552" class="body">Budget reservation</text><text x="557" y="577" class="body">Independent approval</text><text x="557" y="602" class="body">Intent-bound signing</text><text x="557" y="627" class="body">Confirm / reconcile</text></g><g id="payee" data-component="payee" data-box="850,465,300,220"><rect x="850" y="465" width="300" height="220" rx="10" fill="#0c1b2c" stroke="#60a5fa" stroke-width="1.3"/><text x="867" y="496" class="card-title" style="font-size:21px">Payee</text><text x="867" y="527" class="body">Price / inbound policy</text><text x="867" y="552" class="body">Issue payment Challenge</text><text x="867" y="577" class="body">Verify the Credential</text><text x="867" y="602" class="body">External settlement</text><text x="867" y="627" class="body">Confirm before delivery</text></g><text x="540" y="730" class="note" style="font-size:16px">Client → Scenario → Policy → Wallet</text><text x="540" y="760" class="note" style="font-size:16px">Stable run_id · shared-wallet limits · idempotent recovery</text><g id="sql" data-component="sql" data-box="540,810,610,115"><rect x="540" y="810" width="610" height="115" rx="10" fill="#0c1b2c" stroke="#60a5fa" stroke-width="1.3"/><text x="557" y="841" class="card-title" style="font-size:21px">Authoritative SQL</text><text x="557" y="872" class="body">Catalog · encrypted keys · Intent · Approval · Ledger</text><text x="557" y="897" class="body">Atomic state transitions and confirmed postings</text></g><text x="1230" y="436" class="zone-title">External settlement</text><g id="provider" data-component="provider" data-box="1230,465,310,165"><rect x="1230" y="465" width="310" height="165" rx="10" fill="#0c1b2c" stroke="#fbbf24" stroke-width="1.3"/><text x="1247" y="496" class="card-title" style="font-size:20px">Facilitator / Provider</text><text x="1247" y="527" class="body">x402 verify / settle</text><text x="1247" y="552" class="body">MPP Tempo charge</text><text x="1247" y="577" class="body">Returns settlement evidence</text></g><g id="chain" data-component="chain" data-box="1230,710,310,165"><rect x="1230" y="710" width="310" height="165" rx="10" fill="#0c1b2c" stroke="#fbbf24" stroke-width="1.3"/><text x="1247" y="741" class="card-title" style="font-size:20px">Blockchain RPC</text><text x="1247" y="772" class="body">EVM chains / Solana / Tempo</text><text x="1247" y="797" class="body">Live balance and gas checks</text><text x="1247" y="822" class="body">Transfer and confirmation evidence</text></g><g data-call-label="1"><rect x="178.0" y="687" width="164" height="26" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.7"/><text x="260" y="705" text-anchor="middle" class="call-label">1 · Resource / 402</text></g><g data-call-label="2a"><rect x="482.0" y="218" width="36" height="26" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.7"/><text x="500" y="236" text-anchor="middle" class="call-label">2a</text></g><g data-call-label="2b"><rect x="475.0" y="377" width="36" height="26" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.7"/><text x="493" y="395" text-anchor="middle" class="call-label">2b</text></g><g data-call-label="2c"><rect x="489.0" y="632" width="36" height="26" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.7"/><text x="507" y="650" text-anchor="middle" class="call-label">2c</text></g><g data-call-label="3"><rect x="1006.0" y="218" width="28" height="26" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.7"/><text x="1020" y="236" text-anchor="middle" class="call-label">3</text></g><g data-call-label="4"><rect x="768.0" y="367" width="164" height="26" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.7"/><text x="850" y="385" text-anchor="middle" class="call-label">4 · Protected APIs</text></g><g data-call-label="5"><rect x="1176.0" y="737" width="28" height="26" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.7"/><text x="1190" y="755" text-anchor="middle" class="call-label">5</text></g><g data-call-label="6"><rect x="1186.0" y="522" width="28" height="26" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.7"/><text x="1200" y="540" text-anchor="middle" class="call-label">6</text></g><g data-call-label="7"><rect x="1340.0" y="659" width="180" height="26" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.7"/><text x="1430" y="677" text-anchor="middle" class="call-label">7 · Chain settlement</text></g><g data-call-label="8"><rect x="1096.0" y="779" width="28" height="26" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.7"/><text x="1110" y="797" text-anchor="middle" class="call-label">8</text></g><text x="40" y="997" class="note" style="font-size:16px">Signing is not settlement. Only verified transfer evidence can establish a Ledger posting.</text><rect x="40" y="1025" width="1520" height="90" rx="10" fill="#0b1729" stroke="#35506f"/><text x="60" y="1054" class="note" style="font-size:15px">MCP = Model Context Protocol</text><text x="440" y="1054" class="note" style="font-size:15px">A2A = Agent-to-Agent</text><text x="800" y="1054" class="note" style="font-size:15px">MPP = Machine Payments Protocol</text><text x="1210" y="1054" class="note" style="font-size:15px">EVM = Ethereum Virtual Machine</text><text x="60" y="1087" class="note" style="font-size:15px">Parallel request branches use a/b/c. Responses and retries reuse the same numbered connections.</text></g></svg>
