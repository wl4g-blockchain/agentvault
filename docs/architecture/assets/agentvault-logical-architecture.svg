<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1690" viewBox="0 0 1600 1690" role="img" aria-labelledby="title desc">
<title id="title">AgentVault logical architecture and complete payment sequence</title>
<desc id="desc">Read from top to bottom. Steps 1–3 establish the shared protected access path. Steps 4–20 trace one unpaid resource request through Challenge, authorization, reservation, signing, paid retry, inbound settlement, delivery, and independent outbound confirmation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8abce5"/></marker><linearGradient id="backdrop" x2="1" y2="1"><stop stop-color="#06111f"/><stop offset="1" stop-color="#101b31"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#20354b" stroke-opacity="0.22" stroke-width="0.6"/></pattern></defs>
<style>text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#e8f3ff}.title{font-size:31px;font-weight:750}.subtitle{font-size:18px;fill:#9ab3cf}.zone-title{font-size:20px;font-weight:700}.card-title{font-size:18px;font-weight:700}.body{font-size:16px;fill:#b9cde3}.note{font-size:16px;fill:#9ab3cf}.call-label{font-size:16px;fill:#d3eaff}.call{fill:none;stroke:#8abce5;stroke-width:2;stroke-linecap:round;marker-end:url(#arrow)}.response{stroke-dasharray:7 5}.lifeline{stroke:#456482;stroke-opacity:0.7;stroke-width:1.3;stroke-dasharray:4 7}</style>
<rect width="1600" height="1690" fill="url(#backdrop)"/><rect width="1600" height="1690" fill="url(#grid)"/>
<text x="40" y="55" text-anchor="start" class="title">AgentVault | Logical architecture</text><text x="40" y="89" text-anchor="start" class="subtitle">One payment, read from request to confirmed accounting.</text><g id="boundaries"><g id="ui" data-boundary="ui"><rect x="40" y="125" width="390" height="210" rx="14" fill="#0a2529" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="7 5"/></g><g id="authguard" data-boundary="authguard"><rect x="470" y="125" width="660" height="210" rx="14" fill="#201735" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="7 5"/></g><g id="configuration" data-boundary="configuration"><rect x="1170" y="125" width="390" height="210" rx="14" fill="#0d213c" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="7 5"/></g><g id="business-applications" data-boundary="business-applications"><rect x="40" y="435" width="500" height="1160" rx="14" fill="#111e30" stroke="#647f9d" stroke-width="1.5" stroke-dasharray="7 5"/></g><g id="agentvault-core" data-boundary="agentvault-core"><rect x="570" y="435" width="710" height="1160" rx="14" fill="#0d213c" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="7 5"/></g><g id="external-settlement" data-boundary="external-settlement"><rect x="1310" y="435" width="250" height="1160" rx="14" fill="#2b2118" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="7 5"/></g><path class="lifeline" data-lifeline="167" d="M167 575V1565"/><path class="lifeline" data-lifeline="410" d="M410 575V1565"/><path class="lifeline" data-lifeline="690" d="M690 575V1565"/><path class="lifeline" data-lifeline="920" d="M920 575V1565"/><path class="lifeline" data-lifeline="1155" d="M1155 575V1565"/><path class="lifeline" data-lifeline="1435" d="M1435 575V1565"/></g><g id="connections"><path class="call" data-call="1" d="M410 237H490"/><path class="call" data-call="2" d="M790 237H830"/><path class="call" data-call="3" d="M790 295H1190"/><path class="call" data-call="4" d="M167 635H410"/><path class="call" data-call="5" d="M410 690H920"/><path class="call response" data-call="6" d="M410 745H167"/><path class="call" data-call="7" d="M167 800H690"/><path class="call" data-call="8" d="M690 855H1155"/><path class="call" data-call="9" d="M690 940H1435"/><path class="call response" data-call="10" d="M690 995H167"/><path class="call" data-call="11" d="M167 1050H410"/><path class="call" data-call="12" d="M410 1105H920"/><path class="call" data-call="13" d="M920 1160H1435"/><path class="call response" data-call="14" d="M1435 1215H920"/><path class="call" data-call="15" d="M920 1270H1155"/><path class="call response" data-call="16" d="M920 1325H410"/><path class="call response" data-call="17" d="M410 1380H167"/><path class="call" data-call="18" d="M167 1435H690"/><path class="call" data-call="19" d="M690 1490H1435"/><path class="call" data-call="20" d="M690 1545H1155"/></g><g id="components-and-labels"><text x="58" y="154" text-anchor="start" class="zone-title">Browser / application UI</text><g id="management-ui" data-component="management-ui" data-box="60,170,350,140"><rect x="60" y="170" width="350" height="140" rx="10" fill="#0c1b2c" stroke="#2dd4bf" stroke-width="1.3"/><text x="75" y="198" text-anchor="start" class="card-title">Payment administration</text><text x="75" y="225" text-anchor="start" class="body">Payer / Payee Transactions · Approvals</text><text x="75" y="248" text-anchor="start" class="body">Balances &amp; Ledger · Clients</text><text x="75" y="271" text-anchor="start" class="body">Scenarios · Wallets</text></g><text x="488" y="154" text-anchor="start" class="zone-title">Shared AuthGuard access boundary</text><g id="gateway" data-component="gateway" data-box="490,185,300,120"><rect x="490" y="185" width="300" height="120" rx="10" fill="#0c1b2c" stroke="#a78bfa" stroke-width="1.3"/><text x="505" y="213" text-anchor="start" class="card-title">Envoy Gateway</text><text x="505" y="240" text-anchor="start" class="body">All protected APIs</text><text x="505" y="263" text-anchor="start" class="body">Trusted principal forwarding</text></g><g id="auth-service" data-component="auth-service" data-box="830,165,280,100"><rect x="830" y="165" width="280" height="100" rx="10" fill="#0c1b2c" stroke="#a78bfa" stroke-width="1.3"/><text x="845" y="193" text-anchor="start" class="card-title">AuthGuard</text><text x="845" y="220" text-anchor="start" class="body">Identity and access checks</text><text x="845" y="243" text-anchor="start" class="body">One coarse identity component</text></g><text x="1188" y="154" text-anchor="start" class="zone-title">AgentVault administration</text><g id="admin-api" data-component="admin-api" data-box="1190,170,350,140"><rect x="1190" y="170" width="350" height="140" rx="10" fill="#0c1b2c" stroke="#60a5fa" stroke-width="1.3"/><text x="1205" y="198" text-anchor="start" class="card-title">Protected management APIs</text><text x="1205" y="225" text-anchor="start" class="body">Scenario / policy configuration</text><text x="1205" y="248" text-anchor="start" class="body">Approval decisions / wallet setup</text><text x="1205" y="271" text-anchor="start" class="body">Catalog persisted in SQL</text></g><g data-call-label="1"><rect x="406.25" y="207" width="87.5" height="25" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.6"/><text x="450.0" y="225" text-anchor="middle" class="call-label">1  Manage</text></g><g data-call-label="2"><rect x="788.75" y="207" width="42.5" height="25" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.6"/><text x="810.0" y="225" text-anchor="middle" class="call-label">2  </text></g><g data-call-label="3"><rect x="878.75" y="265" width="222.5" height="25" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.6"/><text x="990.0" y="283" text-anchor="middle" class="call-label">3  Route management request</text></g><text x="40" y="375" text-anchor="start" class="note">Every SDK-to-AgentVault message below uses the same protected entry and repeats its access checks.</text><text x="40" y="401" text-anchor="start" class="note">Example: both payment roles share one AgentVault deployment; independently deployed roles use the same contracts.</text><text x="58" y="464" text-anchor="start" class="zone-title">Business applications</text><text x="588" y="464" text-anchor="start" class="zone-title">AgentVault payment core and authoritative state</text><text x="1328" y="464" text-anchor="start" class="zone-title">External settlement</text><g id="payer-sdk" data-component="payer-sdk" data-box="60,485,215,85"><rect x="60" y="485" width="215" height="85" rx="10" fill="#0c1b2c" stroke="#647f9d" stroke-width="1.3"/><text x="75" y="513" text-anchor="start" class="card-title">Business client</text><text x="75" y="540" text-anchor="start" class="body">Payer SDK</text></g><g id="payee-sdk" data-component="payee-sdk" data-box="300,485,220,85"><rect x="300" y="485" width="220" height="85" rx="10" fill="#0c1b2c" stroke="#647f9d" stroke-width="1.3"/><text x="315" y="513" text-anchor="start" class="card-title">Resource service</text><text x="315" y="540" text-anchor="start" class="body">Payee SDK / delivery</text></g><g id="payer" data-component="payer" data-box="590,485,200,85"><rect x="590" y="485" width="200" height="85" rx="10" fill="#0c1b2c" stroke="#60a5fa" stroke-width="1.3"/><text x="605" y="513" text-anchor="start" class="card-title">Payer</text><text x="605" y="540" text-anchor="start" class="body">Authorize / sign</text></g><g id="payee" data-component="payee" data-box="815,485,210,85"><rect x="815" y="485" width="210" height="85" rx="10" fill="#0c1b2c" stroke="#60a5fa" stroke-width="1.3"/><text x="830" y="513" text-anchor="start" class="card-title">Payee</text><text x="830" y="540" text-anchor="start" class="body">Challenge / settle</text></g><g id="sql" data-component="sql" data-box="1050,485,210,85"><rect x="1050" y="485" width="210" height="85" rx="10" fill="#0c1b2c" stroke="#60a5fa" stroke-width="1.3"/><text x="1065" y="513" text-anchor="start" class="card-title">Authoritative SQL</text><text x="1065" y="540" text-anchor="start" class="body">Budgets / Ledger / keys</text></g><g id="provider-rpc" data-component="provider-rpc" data-box="1330,485,210,85"><rect x="1330" y="485" width="210" height="85" rx="10" fill="#0c1b2c" stroke="#fbbf24" stroke-width="1.3"/><text x="1345" y="513" text-anchor="start" class="card-title">Provider / RPC</text><text x="1345" y="540" text-anchor="start" class="body">Settlement / chain data</text></g><g data-call-label="4"><rect x="147.25" y="605" width="282.5" height="25" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.6"/><text x="288.5" y="623" text-anchor="middle" class="call-label">4  Request resource without payment</text></g><g data-call-label="5"><rect x="520.0" y="660" width="290.0" height="25" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.6"/><text x="665.0" y="678" text-anchor="middle" class="call-label">5  Resolve Price and issue Challenge</text></g><g data-call-label="6"><rect x="158.5" y="715" width="260.0" height="25" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.6"/><text x="288.5" y="733" text-anchor="middle" class="call-label">6  402 + bound payment Challenge</text></g><g data-call-label="7"><rect x="268.5" y="770" width="320.0" height="25" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.6"/><text x="428.5" y="788" text-anchor="middle" class="call-label">7  Authorize original Challenge + run_id</text></g><g data-call-label="8"><rect x="785.0" y="825" width="275.0" height="25" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.6"/><text x="922.5" y="843" text-anchor="middle" class="call-label">8  Validate policy; reserve budget</text></g><g data-call-label="9"><rect x="943.75" y="910" width="237.5" height="25" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.6"/><text x="1062.5" y="928" text-anchor="middle" class="call-label">9  Check live balance and gas</text></g><g data-call-label="10"><rect x="291.0" y="965" width="275.0" height="25" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.6"/><text x="428.5" y="983" text-anchor="middle" class="call-label">10  Intent-bound signed Credential</text></g><g data-call-label="11"><rect x="136.0" y="1020" width="305.0" height="25" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.6"/><text x="288.5" y="1038" text-anchor="middle" class="call-label">11  Retry same request with Credential</text></g><g data-call-label="12"><rect x="527.5" y="1075" width="275.0" height="25" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.6"/><text x="665.0" y="1093" text-anchor="middle" class="call-label">12  Verify and settle paid request</text></g><g data-call-label="13"><rect x="1017.5" y="1130" width="320.0" height="25" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.6"/><text x="1177.5" y="1148" text-anchor="middle" class="call-label">13  Provider verification and settlement</text></g><g data-call-label="14"><rect x="1058.75" y="1185" width="237.5" height="25" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.6"/><text x="1177.5" y="1203" text-anchor="middle" class="call-label">14  Trusted transfer evidence</text></g><g data-call-label="15"><rect x="933.75" y="1240" width="207.5" height="25" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.6"/><text x="1037.5" y="1258" text-anchor="middle" class="call-label">15  Commit INBOUND Ledger</text></g><g data-call-label="16"><rect x="535.0" y="1295" width="260.0" height="25" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.6"/><text x="665.0" y="1313" text-anchor="middle" class="call-label">16  Confirmed settlement Receipt</text></g><g data-call-label="17"><rect x="132.25" y="1350" width="312.5" height="25" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.6"/><text x="288.5" y="1368" text-anchor="middle" class="call-label">17  Deliver resource + payment response</text></g><g data-call-label="18"><rect x="317.25" y="1405" width="222.5" height="25" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.6"/><text x="428.5" y="1423" text-anchor="middle" class="call-label">18  Report payment response</text></g><g data-call-label="19"><rect x="906.25" y="1460" width="312.5" height="25" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.6"/><text x="1062.5" y="1478" text-anchor="middle" class="call-label">19  Independently confirm chain receipt</text></g><g data-call-label="20"><rect x="815.0" y="1515" width="215.0" height="25" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.6"/><text x="922.5" y="1533" text-anchor="middle" class="call-label">20  Commit OUTBOUND Ledger</text></g><text x="595" y="893" text-anchor="start" class="note">If approval is required, pause for an independent decision.</text><text x="40" y="1630" text-anchor="start" class="note">A Credential permits a paid retry. A Provider response permits accounting only after evidence validation.</text><text x="40" y="1658" text-anchor="start" class="note">Business delivery follows inbound confirmation; outbound accounting follows independent receipt verification.</text></g></svg>
