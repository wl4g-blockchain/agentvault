<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
<title id="title">AgentVault physical architecture</title>
<desc id="desc">A focused view of management UI, AuthGuard entry, Payer and Payee processing, authoritative SQL, and external settlement. Connections use consecutive numbers; letter suffixes identify parallel branches.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8abce5" /></marker><linearGradient id="backdrop" x2="1" y2="1"><stop stop-color="#06111f" /><stop offset="1" stop-color="#101b31" /></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#20354b" stroke-opacity="0.22" stroke-width="0.6" /></pattern></defs>
<style>text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#e8f3ff}.title{font-size:32px;font-weight:750}.subtitle{font-size:18px;fill:#9ab3cf}.zone-title{font-size:22px;font-weight:700}.card-title{font-weight:700}.body{font-size:17px;fill:#b9cde3}.note{fill:#9ab3cf}.call-label{font-size:16px;fill:#d3eaff}.edge{fill:none;stroke:#8abce5;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}</style>
<rect width="1600" height="1140" fill="url(#backdrop)" /><rect width="1600" height="1140" fill="url(#grid)" />
<text x="40" y="58" class="title">AgentVault | Physical architecture</text>
<text x="40" y="92" class="subtitle">Policy-controlled payments. Trusted settlement. Authoritative accounting.</text>
<path d="M40 110H1560" stroke="#2dd4bf" stroke-opacity="0.25" />
<g id="boundaries"><g id="ui" data-boundary="ui"><rect x="40" y="135" width="440" height="240" rx="14" fill="#0a2529" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="7 5" /></g><g id="authguard" data-boundary="authguard"><rect x="520" y="135" width="1040" height="220" rx="14" fill="#201735" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="7 5" /></g><g id="applications" data-boundary="applications"><rect x="40" y="425" width="440" height="530" rx="14" fill="#111e30" stroke="#647f9d" stroke-width="1.5" stroke-dasharray="7 5" /></g><g id="runtime" data-boundary="runtime"><rect x="520" y="425" width="650" height="530" rx="14" fill="#0d213c" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="7 5" /></g><g id="settlement" data-boundary="settlement"><rect x="1210" y="425" width="350" height="530" rx="14" fill="#2b2118" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="7 5" /></g></g><g id="connections"><path class="edge" data-call="1" d="M 260 645 L 260 755" /><path class="edge" data-call="2a" d="M 460 215 L 540 215" /><path class="edge" data-call="2b" d="M 460 565 L 493 565 L 493 275 L 540 275" /><path class="edge" data-call="2c" d="M 460 840 L 507 840 L 507 298 L 540 298" /><path class="edge" data-call="3" d="M 1000 250 L 1040 250" /><path class="edge" data-call="4a" d="M 640 310 L 640 394 L 490 394 L 490 330 L 460 330" /><path class="edge" data-call="4b" d="M 860 310 L 860 398 L 965 398 L 965 485" /><path class="edge" data-call="5" d="M 1170 680 L 1190 680 L 1190 810 L 1230 810" /><path class="edge" data-call="6" d="M 1170 575 L 1230 575" /><path class="edge" data-call="7" d="M 1385 645 L 1385 730" /><path class="edge" data-call="8" d="M 1080 745 L 1080 815" /></g><g id="components-and-labels"><text x="60" y="166" class="zone-title">Browser / application UI</text><g id="browser" data-component="browser" data-box="60,185,400,75"><rect x="60" y="185" width="400" height="75" rx="10" fill="#0c1b2c" stroke="#2dd4bf" stroke-width="1.3" /><text x="77" y="216" class="card-title" style="font-size:20px">Operations browser</text><text x="77" y="247" class="body">Payer / Payee Transactions · Approvals</text></g><text x="76" y="281" class="note" style="font-size:16px">Balances &amp; Ledger · Clients · Scenarios · Wallets</text><g id="web" data-component="web" data-box="60,305,400,50"><rect x="60" y="305" width="400" height="50" rx="10" fill="#0c1b2c" stroke="#2dd4bf" stroke-width="1.3" /><text x="77" y="336" class="card-title" style="font-size:20px">Web / Nginx :8080 · 2 replicas</text></g><text x="540" y="166" class="zone-title">AuthGuard access boundary</text><g id="gateway" data-component="gateway" data-box="540,195,460,115"><rect x="540" y="195" width="460" height="115" rx="10" fill="#0c1b2c" stroke="#a78bfa" stroke-width="1.3" /><text x="557" y="226" class="card-title" style="font-size:21px">Envoy Gateway</text><text x="557" y="257" class="body">Shared public entry</text><text x="557" y="282" class="body">Routes UI and all protected APIs</text></g><g id="identity" data-component="identity" data-box="1040,195,500,115"><rect x="1040" y="195" width="500" height="115" rx="10" fill="#0c1b2c" stroke="#a78bfa" stroke-width="1.3" /><text x="1057" y="226" class="card-title" style="font-size:21px">AuthGuard</text><text x="1057" y="257" class="body">Identity and access policy</text><text x="1057" y="282" class="body">Authentication / authorization</text></g><text x="60" y="456" class="zone-title">Business application processes</text><g id="payer-sdk" data-component="payer-sdk" data-box="60,485,400,160"><rect x="60" y="485" width="400" height="160" rx="10" fill="#0c1b2c" stroke="#647f9d" stroke-width="1.3" /><text x="77" y="516" class="card-title" style="font-size:21px">Business client</text><text x="77" y="547" class="body">Embedded Payer SDK</text><text x="77" y="572" class="body">HTTP / MCP / A2A calls</text><text x="77" y="597" class="body">No wallet private keys</text></g><g id="payee-sdk" data-component="payee-sdk" data-box="60,755,400,170"><rect x="60" y="755" width="400" height="170" rx="10" fill="#0c1b2c" stroke="#647f9d" stroke-width="1.3" /><text x="77" y="786" class="card-title" style="font-size:21px">Resource service</text><text x="77" y="817" class="body">Embedded Payee SDK</text><text x="77" y="842" class="body">Collect before releasing the resource</text><text x="77" y="867" class="body">Application-owned delivery state</text></g><text x="540" y="456" class="zone-title">AgentVault deployment</text><g id="backend" data-component="backend" data-box="540,485,610,245"><rect x="540" y="485" width="610" height="245" rx="10" fill="#0c1b2c" stroke="#60a5fa" stroke-width="1.3" /><text x="557" y="516" class="card-title" style="font-size:21px">AgentVault backend :8080</text><text x="557" y="547" class="body">Default: 2 replicas · Payer + Payee in one process</text></g><text x="560" y="591" class="note" style="font-size:20px">Payer</text><text x="865" y="591" class="note" style="font-size:20px">Payee</text><text x="560" y="624" class="note" style="font-size:16px">Policy · budget · approval</text><text x="865" y="624" class="note" style="font-size:16px">Price · verify · settle</text><text x="560" y="653" class="note" style="font-size:16px">Wallet custody · signing</text><text x="865" y="653" class="note" style="font-size:16px">Receipt confirmation</text><text x="560" y="702" class="note" style="font-size:16px">Reconcile uncertain payments; preserve the original run_id.</text><text x="540" y="777" class="note" style="font-size:16px">Client → Scenario → Policy → Wallet</text><g id="postgres" data-component="postgres" data-box="540,815,610,110"><rect x="540" y="815" width="610" height="110" rx="10" fill="#0c1b2c" stroke="#60a5fa" stroke-width="1.3" /><text x="557" y="846" class="card-title" style="font-size:21px">PostgreSQL :5432</text><text x="557" y="877" class="body">Shared authoritative payment state</text><text x="557" y="902" class="body">Encrypted wallet keys · Intent · Approval · Ledger</text></g><text x="1230" y="456" class="zone-title">External settlement</text><g id="provider" data-component="provider" data-box="1230,485,310,160"><rect x="1230" y="485" width="310" height="160" rx="10" fill="#0c1b2c" stroke="#fbbf24" stroke-width="1.3" /><text x="1247" y="516" class="card-title" style="font-size:20px">Facilitator / Provider</text><text x="1247" y="547" class="body">x402 verify / settle</text><text x="1247" y="572" class="body">MPP Tempo charge</text><text x="1247" y="597" class="body">Independently operated service</text></g><g id="chain" data-component="chain" data-box="1230,730,310,160"><rect x="1230" y="730" width="310" height="160" rx="10" fill="#0c1b2c" stroke="#fbbf24" stroke-width="1.3" /><text x="1247" y="761" class="card-title" style="font-size:20px">Blockchain RPC</text><text x="1247" y="792" class="body">EVM chains / Solana / Tempo</text><text x="1247" y="817" class="body">Live balances / gas</text><text x="1247" y="842" class="body">Trusted transfer confirmations</text></g><g data-call-label="1"><rect x="178.0" y="687" width="164" height="26" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.7" /><text x="260" y="705" text-anchor="middle" class="call-label">1 · Resource / 402</text></g><g data-call-label="2a"><rect x="482.0" y="183" width="36" height="26" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.7" /><text x="500" y="201" text-anchor="middle" class="call-label">2a</text></g><g data-call-label="2b"><rect x="475.0" y="432" width="36" height="26" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.7" /><text x="493" y="450" text-anchor="middle" class="call-label">2b</text></g><g data-call-label="2c"><rect x="489.0" y="662" width="36" height="26" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.7" /><text x="507" y="680" text-anchor="middle" class="call-label">2c</text></g><g data-call-label="3"><rect x="1006.0" y="218" width="28" height="26" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.7" /><text x="1020" y="236" text-anchor="middle" class="call-label">3</text></g><g data-call-label="4a"><rect x="495.0" y="381" width="140" height="26" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.7" /><text x="565" y="399" text-anchor="middle" class="call-label">4a · Web assets</text></g><g data-call-label="4b"><rect x="879.0" y="437" width="172" height="26" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.7" /><text x="965" y="455" text-anchor="middle" class="call-label">4b · Protected APIs</text></g><g data-call-label="5"><rect x="1176.0" y="752" width="28" height="26" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.7" /><text x="1190" y="770" text-anchor="middle" class="call-label">5</text></g><g data-call-label="6"><rect x="1186.0" y="542" width="28" height="26" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.7" /><text x="1200" y="560" text-anchor="middle" class="call-label">6</text></g><g data-call-label="7"><rect x="1340.0" y="677" width="180" height="26" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.7" /><text x="1430" y="695" text-anchor="middle" class="call-label">7 · Chain settlement</text></g><g data-call-label="8"><rect x="1062.0" y="780" width="76" height="26" rx="5" fill="#10273f" stroke="#42688a" stroke-width="0.7" /><text x="1100" y="798" text-anchor="middle" class="call-label">8 · SQL</text></g><text x="40" y="990" class="note" style="font-size:16px">Default Helm topology shown. Compose uses one combined backend; Payer and Payee can also run as separate processes.</text></g></svg>