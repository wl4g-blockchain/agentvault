server:
  enabled: true
  service_name: agentvault
  host: 0.0.0.0
  port: 8080
  context_path: /api/v1
  authguard:
    enabled: true
    direct_context_hmac_key:
      file: ""
      env: AUTHGUARD__AUTHZ__SCOPE_DELIVERY__DIRECT_CONTEXT_HMAC_KEY

mgmt:
  enabled: true
  host: 0.0.0.0
  port: 9091

logging: { mode: JSON, level: info }

storage:
  instance_key: primary
  provider: postgres
  postgres:
    dsn: { file: "", env: AGENTVAULT_STORAGE_POSTGRES_URL }
    max_connections: 16
    connect_timeout: 5s

cache:
  instance_key: primary
  provider: redis
  redis:
    mode: standalone
    urls: [{ file: "", env: AGENTVAULT_CACHE_REDIS_URL }]
    key_prefix: agentvault

agentvault:
  payer:
    enabled: true
    x402:
      enabled: true
      max_challenge_ttl: 5m
      assets:
        - network: eip155:8453
          contract: "0x0000000000000000000000000000000000001001"
          symbol: USDC
          decimals: 6
    mpp:
      enabled: false
      max_challenge_ttl: 5m
      assets: []
  payee:
    enabled: true
    x402:
      enabled: true
      max_challenge_ttl: 5m
      assets:
        - network: eip155:8453
          contract: "0x0000000000000000000000000000000000001001"
          symbol: USDC
          decimals: 6
      facilitator:
        id: x402-primary
        base_url: https://facilitator.example/x402/
        verify_path: verify
        settle_path: settle
        timeout: 10s
        max_response_bytes: 262144
        allow_insecure_loopback: false
        secret_headers: {}
    mpp:
      enabled: false
      max_challenge_ttl: 5m
      realm: agentvault
      challenge_secret: { file: "", env: AGENTVAULT_MPP_CHALLENGE_SECRET }
      assets: []
      provider:
        id: mpp-primary
        base_url: https://provider.example/mpp/
        verify_path: verify
        settle_path: settle
        timeout: 10s
        max_response_bytes: 262144
        allow_insecure_loopback: false
        secret_headers: {}
  chains:
    "eip155:8453":
      family: evm
      rpc:
        endpoint: https://mainnet.base.org
        timeout: 5s
        max_response_bytes: 262144
        allow_insecure_loopback: false
        secret_headers: {}
      minimum_native_balance: "1000000000000000"
      confirmation_depth: 1
  key_management:
    active_key_id: wallet-kek-v1
    keys:
      wallet-kek-v1: { file: "", env: AGENTVAULT_WALLET_KEK_V1 }
  recovery_encryption:
    active_key_id: recovery-v1
    keys:
      recovery-v1: { file: "", env: AGENTVAULT_RECOVERY_KEY_V1 }
  approval:
    enabled: true
    request_ttl: 15m
    grant_ttl: 5m
    expiry_interval: 15s
    expiry_batch_size: 100
    jwt:
      issuer: agentvault
      audience: agentvault:approval-grant
      active_key_id: approval-hs256-v1
      signing_keys:
        approval-hs256-v1: { file: "", env: AGENTVAULT_APPROVAL_JWT_KEY_V1 }

  reconciliation:
    enabled: true
    interval: 15s
    lease_ttl: 45s
    batch_size: 100
    initial_backoff: 5s
    max_backoff: 5m

  transport:
    grpc:
      enabled: false
      host: 127.0.0.1
      port: 50051
      max_message_bytes: 2097152
      request_timeout: 30s
    local: { enabled: false }
    mqtt:
      enabled: false
      host: ""
      port: 1883
      client_id: agentvault-01
      consumer_group: agentvault-pool
      topic_prefix: agentvault/v1/clients
      qos: 1
      tls: false
      username: agentvault
      password: { file: "", env: "" }
