# Explicit identity-free topology. It exists for isolated trusted networks and
# development only; both Dashboard and API are forwarded without AuthGuard.
static_resources:
  listeners:
    - name: edge
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: agentvault_open_edge
                normalize_path: true
                route_config:
                  name: open_routes
                  virtual_hosts:
                    - name: agentvault
                      domains: ["*"]
                      routes:
                        - match: { prefix: /api/v1/ }
                          route: { cluster: agentvault_api, timeout: 15s }
                        - match: { prefix: /agentvault-management/ }
                          route: { cluster: agentvault_management, prefix_rewrite: /, timeout: 5s }
                        - match: { prefix: / }
                          route: { cluster: agentvault_web }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: agentvault_api
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: agentvault_api
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: agentvault, port_value: 8080 } } } }] }]
    - name: agentvault_web
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: agentvault_web
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: agentvault-web, port_value: 8080 } } } }] }]
    - name: agentvault_management
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: agentvault_management
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: agentvault, port_value: 9091 } } } }] }]
