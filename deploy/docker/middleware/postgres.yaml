# Reusable PostgreSQL process. The owning deployment supplies credentials and data.
services:
  postgres:
    image: ${POSTGRES_IMAGE:-registry.cn-shenzhen.aliyuncs.com/wl4g/pgvector_pgvector:pg16}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER:-agentvault}" -d "$${POSTGRES_DB:-agentvault}"']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
