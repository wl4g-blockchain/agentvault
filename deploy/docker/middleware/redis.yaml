services:
  redis:
    image: ${REDIS_IMAGE:-redis:7.2-alpine}
    command: [sh, -ec, ': "$${REDIS_PASSWORD:?set Redis password}"; exec redis-server --save "" --appendonly no --requirepass "$${REDIS_PASSWORD}"']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
