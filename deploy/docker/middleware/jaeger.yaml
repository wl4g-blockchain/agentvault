services:
  jaeger:
    image: ${JAEGER_IMAGE:-registry.cn-shenzhen.aliyuncs.com/wl4g/jaegertracing_all-in-one:1.76.0}
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    command: ["--memory.max-traces=5000"]
    expose: [16686, 4317, 4318]
    healthcheck:
      test: [CMD, wget, --quiet, --spider, "http://127.0.0.1:14269/"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
