x-agentvault: &agentvault
  image: ${AGENTVAULT_IMAGE:?set AGENTVAULT_IMAGE in .env}
  build:
    context: ../..
    dockerfile: Dockerfile
  command: [--config, /etc/agentvault/agentvault.yaml, serve]
  env_file: ["${AGENTVAULT_ENV_FILE:-.env}"]
  environment:
    RUST_LOG: ${RUST_LOG:-info}
  volumes:
    - ./config/agentvault.yaml:/etc/agentvault/agentvault.yaml:ro
  restart: unless-stopped

services:
  agentvault-postgres:
    image: registry.cn-shenzhen.aliyuncs.com/wl4g/bitnami_postgresql:18.3
    environment:
      POSTGRESQL_USERNAME: agentvault
      POSTGRESQL_PASSWORD: ${AGENTVAULT_POSTGRES_PASSWORD:?set AGENTVAULT_POSTGRES_PASSWORD in .env}
      POSTGRESQL_DATABASE: agentvault
    volumes: [agentvault-postgres-data:/bitnami/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U agentvault -d agentvault]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  agentvault-redis:
    image: redis:7.2-alpine
    command: [redis-server, --save, "", --appendonly, "no", --requirepass, "${AGENTVAULT_REDIS_PASSWORD:?set AGENTVAULT_REDIS_PASSWORD in .env}"]
    healthcheck:
      test: [CMD-SHELL, 'redis-cli --no-auth-warning -a "$${AGENTVAULT_REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 30
    environment:
      AGENTVAULT_REDIS_PASSWORD: ${AGENTVAULT_REDIS_PASSWORD:?set AGENTVAULT_REDIS_PASSWORD in .env}
    restart: unless-stopped

  agentvault:
    <<: *agentvault
    depends_on:
      agentvault-postgres: { condition: service_healthy }
      agentvault-redis: { condition: service_healthy }
    expose: [8080, 9091]
    ports:
      - 127.0.0.1:9091:9091

  agentvault-web:
    image: ${AGENTVAULT_WEB_IMAGE:?set AGENTVAULT_WEB_IMAGE in .env}
    build: { context: ../../web, dockerfile: Dockerfile }
    expose: [8080]
    restart: unless-stopped

  authguard-postgres:
    image: registry.cn-shenzhen.aliyuncs.com/wl4g/bitnami_postgresql:18.3
    environment:
      POSTGRESQL_USERNAME: authguard
      POSTGRESQL_PASSWORD: ${AUTHGUARD__STORAGE__POSTGRES__PASSWORD:?set AuthGuard PostgreSQL password in .env}
      POSTGRESQL_DATABASE: authguard
    volumes: [authguard-postgres-data:/bitnami/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U authguard -d authguard]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  authguard-redis:
    image: redis:7.2-alpine
    command: [redis-server, --save, "", --appendonly, "no", --requirepass, "${AUTHGUARD__CACHE__REDIS__PASSWORD:?set AuthGuard Redis password in .env}"]
    restart: unless-stopped

  authguard-authn:
    image: ${AUTHGUARD_IMAGE:?set AUTHGUARD_IMAGE in .env}
    command: [--config, /etc/authguard/authguard.yaml, authn, --bind, 0.0.0.0:8082]
    env_file: ["${AGENTVAULT_ENV_FILE:-.env}"]
    environment: { AUTHGUARD__SERVER__SERVICE_NAME: authguard-authn }
    volumes: [./config/authguard.yaml:/etc/authguard/authguard.yaml:ro]
    depends_on:
      authguard-postgres: { condition: service_healthy }
      authguard-redis: { condition: service_started }
    expose: [8082]
    restart: unless-stopped

  authguard-authz:
    image: ${AUTHGUARD_IMAGE:?set AUTHGUARD_IMAGE in .env}
    command: [--config, /etc/authguard/authguard.yaml, authz]
    env_file: ["${AGENTVAULT_ENV_FILE:-.env}"]
    environment: { AUTHGUARD__SERVER__SERVICE_NAME: authguard-authz }
    volumes: [./config/authguard.yaml:/etc/authguard/authguard.yaml:ro]
    depends_on:
      authguard-postgres: { condition: service_healthy }
      authguard-redis: { condition: service_started }
    expose: [8080, 8081]
    restart: unless-stopped

  authguard-web:
    image: ${AUTHGUARD_WEB_IMAGE:?set AUTHGUARD_WEB_IMAGE in .env}
    expose: [8080]
    restart: unless-stopped

  envoy:
    image: registry.cn-shenzhen.aliyuncs.com/wl4g/envoyproxy_envoy:distroless-v1.36.4
    command: [-c, /etc/envoy/envoy.yaml, --log-level, info]
    volumes: [./config/envoy.yaml:/etc/envoy/envoy.yaml:ro]
    ports: [8080:8080]
    depends_on:
      agentvault: { condition: service_started }
      agentvault-web: { condition: service_started }
      authguard-authn: { condition: service_started }
      authguard-authz: { condition: service_started }
      authguard-web: { condition: service_started }
    restart: unless-stopped

volumes:
  agentvault-postgres-data: {}
  authguard-postgres-data: {}
