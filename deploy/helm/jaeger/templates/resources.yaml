{{- $name := default (printf "%s-jaeger" .Release.Name) .Values.fullnameOverride -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: jaeger, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: jaeger, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: jaeger
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--memory.max-traces={{ .Values.maxTraces }}"]
          env: [{ name: COLLECTOR_OTLP_ENABLED, value: "true" }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          ports:
            - { name: ui, containerPort: 16686 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: admin, containerPort: 14269 }
          readinessProbe:
            httpGet: { path: /, port: admin }
          livenessProbe:
            httpGet: { path: /, port: admin }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector: { app.kubernetes.io/name: jaeger, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports:
    - { name: ui, port: 16686, targetPort: ui }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
