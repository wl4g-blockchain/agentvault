global:
  imagePullSecrets: []

agentvault:
  # Kubernetes resources for the Rust AgentVault backend.
  backend:
    nameOverride: ""
    fullnameOverride: ""
    replicaCount: 2
    image:
      repository: ghcr.io/wl4g-blockchain/agentvault
      tag: ""
      pullPolicy: IfNotPresent
    serviceAccount:
      create: true
      name: ""
      annotations: {}
    podAnnotations: {}
    podLabels: {}
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 1000m, memory: 512Mi }
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    extraContainers: []
    extraInitContainers: []
    extraVolumes: []

    # Optional declarative resource import before the backend starts. Each
    # document uses {consoleVersion, kind, metadata, data}; this is not runtime
    # configuration and does not create chain funds or submit payments.
    resourceImport:
      enabled: false
      configMap: ""
      key: resources.yaml

    service:
      type: ClusterIP
      apiPort: 8080
      managementPort: 9091
      grpcPort: 50051

    route:
      enabled: true
      gatewayName: agentvault-authguard
      sectionName: http
      hostnames: [agentvault.example.com]

    # Sensitive values are injected as canonical AGENTVAULT__... field paths.
    # Never put secret values in Helm values because Helm stores release values.
    secrets:
      provider: kubernetes  # kubernetes | gcp | aws | vault
      kubernetes:
        existingSecret: agentvault-secrets
      gcp:
        secretResourceName: ""
      aws:
        region: ""
        secretName: ""
      vault:
        vaultRole: ""
        secretPath: ""
      serviceAccount:
        annotations: {}

    # Deployment-specific scalar overrides. Values are rendered with tpl.
    # Complex maps/lists belong in agentvault.agentvault-config below.
    env:
      AGENTVAULT__SERVER__ENABLED: "true"
      AGENTVAULT__SERVER__HOST: "0.0.0.0"
      AGENTVAULT__SERVER__PORT: "{{ .Values.agentvault.backend.service.apiPort }}"
      AGENTVAULT__SERVER__AUTHGUARD__ENABLED: '{{ include "agentvault.authguardEnabled" . }}'
      AGENTVAULT__SERVER__AUTHGUARD__SCOPE_RESOLVER__TARGET: "http://{{ .Release.Name }}-authguard:8081"
      AGENTVAULT__MGMT__HOST: "0.0.0.0"
      AGENTVAULT__MGMT__PORT: "{{ .Values.agentvault.backend.service.managementPort }}"
      AGENTVAULT__LOGGING__MODE: "JSON"
      AGENTVAULT__STORAGE__PROVIDER: "postgres"
      AGENTVAULT__STORAGE__POSTGRES__MAX_CONNECTIONS: "32"
      AGENTVAULT__CACHE__PROVIDER: "redis"
      AGENTVAULT__AGENTVAULT__PAYER__ENABLED: "true"
      AGENTVAULT__AGENTVAULT__PAYER__X402__ENABLED: "true"
      AGENTVAULT__AGENTVAULT__PAYEE__ENABLED: "true"
      AGENTVAULT__AGENTVAULT__PAYEE__X402__ENABLED: "true"
      AGENTVAULT__AGENTVAULT__TRANSPORT__GRPC__ENABLED: "false"
      AGENTVAULT__AGENTVAULT__TRANSPORT__GRPC__HOST: "0.0.0.0"
      AGENTVAULT__AGENTVAULT__TRANSPORT__GRPC__PORT: "{{ .Values.agentvault.backend.service.grpcPort }}"

    management:
      serviceMonitor:
        enabled: false
        interval: 30s
        labels: {}

    networkPolicy:
      enabled: true
      envoyNamespaceSelector: {}
      envoyPodSelector: { app.kubernetes.io/name: envoy }
      monitoringNamespaceSelector: {}
      monitoringPodSelector: { app.kubernetes.io/name: prometheus }

  # Kubernetes resources for the static AgentVault web frontend.
  frontend:
    enabled: true
    replicaCount: 2
    image:
      repository: ghcr.io/wl4g-blockchain/agentvault-web
      tag: ""
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8080
    route:
      enabled: true
      gatewayName: agentvault-authguard
      sectionName: http
      hostnames: [agentvault.example.com]
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 250m, memory: 128Mi }

  # Optional native agentvault.yaml override. Keep empty to use the canonical
  # etc/agentvault.yaml embedded in the runtime image; use this only for
  # complex maps/lists that cannot be expressed as scalar ENV overrides.
  agentvault-config: ""

# AuthGuard dependency middleware. This subtree is passed directly to the
# AuthGuard dependency chart without translating its native values.
authguard:
  enabled: true
  envoy_gateway:
    enabled: true
    nameOverride: agentvault-envoy-gateway
    ext_authz:
      enabled: true
      gateway:
        create: true
        name: agentvault-authguard
        className: agentvault-authguard
      authguardRoute: { enabled: false }
      authnRoute:
        enabled: true
        name: agentvault-authn
        hostnames: [agentvault.example.com]
  authguard:
    authn:
      applications:
        agentvault:
          hosts: [agentvault.example.com]
          displayName: AgentVault
          logo: /mark.svg
          returnUris: [https://agentvault.example.com/**]
    web:
      enabled: true
      route:
        enabled: true
        hostnames: [agentvault.example.com]
    authz: { enabled: true }
  secrets:
    provider: kubernetes
    kubernetes: { existingSecret: authguard-secrets }
  postgresql:
    auth: { existingSecret: authguard-secrets }
  redis_cluster:
    existingSecret: authguard-secrets
