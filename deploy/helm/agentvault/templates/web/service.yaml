{{- $frontend := .Values.agentvault.frontend -}}
{{- if $frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentvault.fullname" . }}-web
  labels:
    {{- include "agentvault.labels" . | nindent 4 }}
spec:
  type: {{ $frontend.service.type }}
  selector:
    {{- include "agentvault.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports: [{ name: http, port: {{ $frontend.service.port }}, targetPort: http }]
{{- end }}
