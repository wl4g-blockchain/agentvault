{{- $frontend := .Values.agentvault.frontend -}}
{{- if $frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentvault.fullname" . }}-web
  labels:
    {{- include "agentvault.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ $frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentvault.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "agentvault.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: "{{ $frontend.image.repository }}:{{ default .Chart.AppVersion $frontend.image.tag }}"
          imagePullPolicy: {{ $frontend.image.pullPolicy }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            {{- toYaml $frontend.resources | nindent 12 }}
{{- end }}
