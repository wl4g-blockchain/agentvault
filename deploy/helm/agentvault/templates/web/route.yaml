{{- $authguard := .Values.authguard -}}
{{- $frontend := .Values.agentvault.frontend -}}
{{- if and $frontend.route.enabled $authguard.enabled $frontend.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "agentvault.fullname" . }}-web
  labels:
    {{- include "agentvault.labels" . | nindent 4 }}
spec:
  parentRefs:
    - { name: {{ $frontend.route.gatewayName }}, sectionName: {{ $frontend.route.sectionName }} }
  {{- with $frontend.route.hostnames }}
  hostnames: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: {{ include "agentvault.fullname" . }}-web, port: {{ $frontend.service.port }} }]
{{- end }}
