{{- $backend := .Values.agentvault.backend -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentvault.fullname" . }}
  labels:
    {{- include "agentvault.labels" . | nindent 4 }}
spec:
  type: {{ $backend.service.type }}
  selector:
    {{- include "agentvault.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - { name: api, port: {{ $backend.service.apiPort }}, targetPort: api }
    {{- if eq (include "agentvault.grpcEnabled" .) "true" }}
    - { name: grpc, port: {{ $backend.service.grpcPort }}, targetPort: grpc, appProtocol: kubernetes.io/h2c }
    {{- end }}
