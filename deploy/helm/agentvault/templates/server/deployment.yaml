{{- $backend := .Values.agentvault.backend -}}
{{- $provider := include "agentvault.secretsProvider" . -}}
{{- $runtimeConfig := index .Values.agentvault "agentvault-config" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentvault.fullname" . }}
  labels:
    {{- include "agentvault.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ $backend.replicaCount }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels:
      {{- include "agentvault.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/platform/runtime-config-map.yaml") . | sha256sum }}
        checksum/secrets: {{ $backend.secrets | toJson | sha256sum }}
        checksum/resource-import: {{ $backend.resourceImport | toJson | sha256sum }}
        {{- if eq $provider "vault" }}
        {{- include "agentvault.vaultAnnotations" . | nindent 8 }}
        {{- end }}
        {{- with $backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "agentvault.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
        authguard.io/scope-client: "true"
        {{- with $backend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "agentvault.serviceAccountName" . }}
      # Vault Agent authenticates through the workload ServiceAccount. Other
      # providers do not expose a token inside the application pod.
      automountServiceAccountToken: {{ eq $provider "vault" }}
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $backend.resourceImport.enabled $backend.extraInitContainers }}
      initContainers:
        {{- if $backend.resourceImport.enabled }}
        - name: resource-import
          image: "{{ $backend.image.repository }}:{{ default .Chart.AppVersion $backend.image.tag }}"
          imagePullPolicy: {{ $backend.image.pullPolicy }}
          args:
            - --config
            - /etc/agentvault/agentvault.yaml
            - console
            - import
            - /etc/agentvault-import/{{ $backend.resourceImport.key }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          env:
            {{- range $name, $value := $backend.env }}
            - name: {{ $name }}
              value: {{ tpl ($value | toString) $ | quote }}
            {{- end }}
          {{- if or (eq $provider "gcp") (eq $provider "aws") }}
            - name: AGENTVAULT__SECRETS__ENV_FILE
              value: {{ include "agentvault.csiSecretsMountPath" . }}/env
          {{- else if eq $provider "vault" }}
            - name: AGENTVAULT__SECRETS__ENV_FILE
              value: /vault/secrets/env
          {{- end }}
          {{- if and (eq $provider "kubernetes") $backend.secrets.kubernetes.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ $backend.secrets.kubernetes.existingSecret | quote }}
          {{- end }}
          volumeMounts:
            {{- if $runtimeConfig }}
            - { name: config, mountPath: /etc/agentvault, readOnly: true }
            {{- end }}
            # ConfigMap volumes are symlink projections, while resource import
            # deliberately opens inputs with O_NOFOLLOW. Mount the selected
            # key as a file so the security check and Kubernetes projection
            # semantics remain compatible.
            - name: resource-import
              mountPath: /etc/agentvault-import/{{ $backend.resourceImport.key }}
              subPath: {{ $backend.resourceImport.key | quote }}
              readOnly: true
            {{- if or (eq $provider "gcp") (eq $provider "aws") }}
            - name: csi-secrets
              mountPath: {{ include "agentvault.csiSecretsMountPath" . }}
              readOnly: true
            {{- end }}
        {{- end }}
        {{- with $backend.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: agentvault
          image: "{{ $backend.image.repository }}:{{ default .Chart.AppVersion $backend.image.tag }}"
          imagePullPolicy: {{ $backend.image.pullPolicy }}
          args: [--config, /etc/agentvault/agentvault.yaml, serve]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          env:
            {{- range $name, $value := $backend.env }}
            - name: {{ $name }}
              value: {{ tpl ($value | toString) $ | quote }}
            {{- end }}
          {{- if or (eq $provider "gcp") (eq $provider "aws") }}
            - name: AGENTVAULT__SECRETS__ENV_FILE
              value: {{ include "agentvault.csiSecretsMountPath" . }}/env
          {{- else if eq $provider "vault" }}
            - name: AGENTVAULT__SECRETS__ENV_FILE
              value: /vault/secrets/env
          {{- end }}
          {{- if and (eq $provider "kubernetes") $backend.secrets.kubernetes.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ $backend.secrets.kubernetes.existingSecret | quote }}
          {{- end }}
          ports:
            - { name: api, containerPort: {{ $backend.service.apiPort }} }
            - { name: management, containerPort: {{ $backend.service.managementPort }} }
            {{- if eq (include "agentvault.grpcEnabled" .) "true" }}
            - { name: grpc, containerPort: {{ $backend.service.grpcPort }} }
            {{- end }}
          startupProbe: { httpGet: { path: /healthz, port: management }, periodSeconds: 2, failureThreshold: 30 }
          livenessProbe: { httpGet: { path: /healthz, port: management }, periodSeconds: 10, timeoutSeconds: 2 }
          readinessProbe: { httpGet: { path: /readyz, port: management }, periodSeconds: 5, timeoutSeconds: 2 }
          resources:
            {{- toYaml $backend.resources | nindent 12 }}
          {{- if or $runtimeConfig (eq $provider "gcp") (eq $provider "aws") }}
          volumeMounts:
            {{- if $runtimeConfig }}
            - { name: config, mountPath: /etc/agentvault, readOnly: true }
            {{- end }}
            {{- if or (eq $provider "gcp") (eq $provider "aws") }}
            - name: csi-secrets
              mountPath: {{ include "agentvault.csiSecretsMountPath" . }}
              readOnly: true
            {{- end }}
          {{- end }}
        {{- with $backend.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or $runtimeConfig $backend.resourceImport.enabled (eq $provider "gcp") (eq $provider "aws") $backend.extraVolumes }}
      volumes:
        {{- if $runtimeConfig }}
        - name: config
          configMap: { name: {{ include "agentvault.fullname" . }}-config }
        {{- end }}
        {{- if $backend.resourceImport.enabled }}
        - name: resource-import
          configMap:
            name: {{ required "agentvault.backend.resourceImport.configMap is required when resource import is enabled" $backend.resourceImport.configMap | quote }}
            items:
              - key: {{ $backend.resourceImport.key | quote }}
                path: {{ $backend.resourceImport.key | quote }}
        {{- end }}
        {{- if or (eq $provider "gcp") (eq $provider "aws") }}
        - name: csi-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ printf "%s-%s-secrets" (include "agentvault.fullname" .) $provider }}
        {{- end }}
        {{- with $backend.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with $backend.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $backend.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $backend.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $backend.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml . | nindent 8 }}
      {{- end }}
