{{- $backend := .Values.agentvault.backend -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentvault.fullname" . }}-management
  labels:
    {{- include "agentvault.labels" . | nindent 4 }}
    app.kubernetes.io/component: management
spec:
  type: ClusterIP
  selector:
    {{- include "agentvault.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - { name: management, port: {{ $backend.service.managementPort }}, targetPort: management }
