{{- if .Values.networkPolicy.enabled }}
{{- $middleware := index .Values "authguard-middleware" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentvault.fullname" . }}
  labels:
    {{- include "agentvault.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentvault.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes: [Ingress]
  ingress:
    {{- if $middleware.enabled }}
    - from:
        - namespaceSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.envoyNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.envoyPodSelector | nindent 14 }}
      ports: [{ protocol: TCP, port: {{ .Values.service.apiPort }} }]
    {{- if .Values.runtime.grpc.enabled }}
    - from:
        - namespaceSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.envoyNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.envoyPodSelector | nindent 14 }}
      ports: [{ protocol: TCP, port: {{ .Values.service.grpcPort }} }]
    {{- end }}
    {{- else }}
    # Disabling the AuthGuard dependency is an explicit open-edge decision.
    # Permit the externally exposed data-plane Service while keeping the
    # management listener constrained by the rules below.
    - ports:
        - { protocol: TCP, port: {{ .Values.service.apiPort }} }
        {{- if .Values.runtime.grpc.enabled }}
        - { protocol: TCP, port: {{ .Values.service.grpcPort }} }
        {{- end }}
    {{- end }}
    - from:
        - namespaceSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.envoyNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.envoyPodSelector | nindent 14 }}
      ports: [{ protocol: TCP, port: {{ .Values.service.managementPort }} }]
    - from:
        - namespaceSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.monitoringNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.monitoringPodSelector | nindent 14 }}
      ports: [{ protocol: TCP, port: {{ .Values.service.managementPort }} }]
{{- end }}
