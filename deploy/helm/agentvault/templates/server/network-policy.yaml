{{- $backend := .Values.agentvault.backend -}}
{{- if $backend.networkPolicy.enabled }}
{{- $authguard := .Values.authguard }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentvault.fullname" . }}
  labels:
    {{- include "agentvault.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentvault.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes: [Ingress]
  ingress:
    {{- if $authguard.enabled }}
    - from:
        - namespaceSelector:
            matchLabels: {{ toYaml $backend.networkPolicy.envoyNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels: {{ toYaml $backend.networkPolicy.envoyPodSelector | nindent 14 }}
      ports: [{ protocol: TCP, port: {{ $backend.service.apiPort }} }]
    {{- if eq (include "agentvault.grpcEnabled" .) "true" }}
    - from:
        - namespaceSelector:
            matchLabels: {{ toYaml $backend.networkPolicy.envoyNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels: {{ toYaml $backend.networkPolicy.envoyPodSelector | nindent 14 }}
      ports: [{ protocol: TCP, port: {{ $backend.service.grpcPort }} }]
    {{- end }}
    {{- else }}
    # Disabling the AuthGuard dependency is an explicit open-edge decision.
    # Permit the externally exposed data-plane Service while keeping the
    # management listener constrained by the rules below.
    - ports:
        - { protocol: TCP, port: {{ $backend.service.apiPort }} }
        {{- if eq (include "agentvault.grpcEnabled" .) "true" }}
        - { protocol: TCP, port: {{ $backend.service.grpcPort }} }
        {{- end }}
    {{- end }}
    - from:
        - namespaceSelector:
            matchLabels: {{ toYaml $backend.networkPolicy.envoyNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels: {{ toYaml $backend.networkPolicy.envoyPodSelector | nindent 14 }}
      ports: [{ protocol: TCP, port: {{ $backend.service.managementPort }} }]
    - from:
        - namespaceSelector:
            matchLabels: {{ toYaml $backend.networkPolicy.monitoringNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels: {{ toYaml $backend.networkPolicy.monitoringPodSelector | nindent 14 }}
      ports: [{ protocol: TCP, port: {{ $backend.service.managementPort }} }]
{{- end }}
