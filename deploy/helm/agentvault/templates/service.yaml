apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentvault.fullname" . }}
  labels:
    {{- include "agentvault.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "agentvault.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - { name: api, port: {{ .Values.service.apiPort }}, targetPort: api }
    {{- if .Values.runtime.grpc.enabled }}
    - { name: grpc, port: {{ .Values.service.grpcPort }}, targetPort: grpc, appProtocol: kubernetes.io/h2c }
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentvault.fullname" . }}-management
  labels:
    {{- include "agentvault.labels" . | nindent 4 }}
    app.kubernetes.io/component: management
spec:
  type: ClusterIP
  selector:
    {{- include "agentvault.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - { name: management, port: {{ .Values.service.managementPort }}, targetPort: management }
