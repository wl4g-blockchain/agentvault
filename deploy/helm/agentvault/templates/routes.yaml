{{- $middleware := index .Values "authguard-middleware" -}}
{{- if and .Values.routes.enabled $middleware.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "agentvault.fullname" . }}-api
  labels:
    {{- include "agentvault.labels" . | nindent 4 }}
    authguard.io/protected: "true"
spec:
  parentRefs:
    - { name: {{ .Values.routes.gatewayName }}, sectionName: {{ .Values.routes.sectionName }} }
  {{- with .Values.routes.hostnames }}
  hostnames: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api/v1/ } }]
      backendRefs: [{ name: {{ include "agentvault.fullname" . }}, port: {{ .Values.service.apiPort }} }]
    {{- if .Values.runtime.grpc.enabled }}
    - matches: [{ path: { type: PathPrefix, value: /agentvault.transport.v1.PaymentTransport/ } }]
      backendRefs: [{ name: {{ include "agentvault.fullname" . }}, port: {{ .Values.service.grpcPort }} }]
    {{- end }}
    - matches: [{ path: { type: PathPrefix, value: /agentvault-management/ } }]
      filters:
        - type: URLRewrite
          urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: / } }
      backendRefs: [{ name: {{ include "agentvault.fullname" . }}-management, port: {{ .Values.service.managementPort }} }]
{{- if .Values.web.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "agentvault.fullname" . }}-web
  labels:
    {{- include "agentvault.labels" . | nindent 4 }}
spec:
  parentRefs:
    - { name: {{ .Values.routes.gatewayName }}, sectionName: {{ .Values.routes.sectionName }} }
  {{- with .Values.routes.hostnames }}
  hostnames: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: {{ include "agentvault.fullname" . }}-web, port: {{ .Values.web.service.port }} }]
{{- end }}
{{- end }}
