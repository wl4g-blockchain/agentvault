{{- $config := index .Values.agentvault "agentvault-config" -}}
{{- if $config }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentvault.fullname" . }}-config
  labels:
    {{- include "agentvault.labels" . | nindent 4 }}
data:
  agentvault.yaml: |
{{- tpl $config . | nindent 4 }}
{{- end }}
