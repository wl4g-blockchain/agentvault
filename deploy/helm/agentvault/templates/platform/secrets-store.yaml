{{- $provider := include "agentvault.secretsProvider" . -}}
{{- if eq $provider "gcp" }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "agentvault.fullname" . }}-gcp-secrets
  labels:
    {{- include "agentvault.labels" . | nindent 4 }}
    app.kubernetes.io/component: credential-provider
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: {{ required "agentvault.backend.secrets.gcp.secretResourceName is required when secrets.provider=gcp" .Values.agentvault.backend.secrets.gcp.secretResourceName | quote }}
        fileName: env
{{- else if eq $provider "aws" }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "agentvault.fullname" . }}-aws-secrets
  labels:
    {{- include "agentvault.labels" . | nindent 4 }}
    app.kubernetes.io/component: credential-provider
spec:
  provider: aws
  parameters:
    region: {{ required "agentvault.backend.secrets.aws.region is required when secrets.provider=aws" .Values.agentvault.backend.secrets.aws.region | quote }}
    objects: |
      - objectName: {{ required "agentvault.backend.secrets.aws.secretName is required when secrets.provider=aws" .Values.agentvault.backend.secrets.aws.secretName | quote }}
        objectType: "secretsmanager"
        objectAlias: env
{{- else if not (has $provider (list "kubernetes" "vault")) }}
{{- fail "secrets.provider must be one of kubernetes | gcp | aws | vault" }}
{{- end }}
