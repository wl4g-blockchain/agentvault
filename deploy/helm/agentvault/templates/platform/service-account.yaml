{{- if .Values.agentvault.backend.serviceAccount.create }}
{{- $annotations := merge (deepCopy .Values.agentvault.backend.serviceAccount.annotations) .Values.agentvault.backend.secrets.serviceAccount.annotations }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentvault.serviceAccountName" . }}
  labels:
    {{- include "agentvault.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
