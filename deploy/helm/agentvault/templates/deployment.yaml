{{- $provider := include "agentvault.secretsProvider" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentvault.fullname" . }}
  labels:
    {{- include "agentvault.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels:
      {{- include "agentvault.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ .Values.secrets | toJson | sha256sum }}
        {{- if eq $provider "vault" }}
        {{- include "agentvault.vaultAnnotations" . | nindent 8 }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "agentvault.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
        authguard.io/scope-client: "true"
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "agentvault.serviceAccountName" . }}
      # Vault Agent authenticates through the workload ServiceAccount. Other
      # providers do not expose a token inside the application pod.
      automountServiceAccountToken: {{ eq $provider "vault" }}
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agentvault
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [--config, /etc/agentvault/agentvault.yaml, serve]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          {{- if or (eq $provider "gcp") (eq $provider "aws") }}
          env:
            - name: AGENTVAULT_SECRETS_ENV_FILE
              value: {{ include "agentvault.csiSecretsMountPath" . }}/env
          {{- else if eq $provider "vault" }}
          env:
            - name: AGENTVAULT_SECRETS_ENV_FILE
              value: /vault/secrets/env
          {{- end }}
          {{- if and (eq $provider "kubernetes") .Values.secrets.kubernetes.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.kubernetes.existingSecret | quote }}
          {{- end }}
          ports:
            - { name: api, containerPort: {{ .Values.service.apiPort }} }
            - { name: management, containerPort: {{ .Values.service.managementPort }} }
            {{- if .Values.runtime.grpc.enabled }}
            - { name: grpc, containerPort: {{ .Values.service.grpcPort }} }
            {{- end }}
          startupProbe: { httpGet: { path: /healthz, port: management }, periodSeconds: 2, failureThreshold: 30 }
          livenessProbe: { httpGet: { path: /healthz, port: management }, periodSeconds: 10, timeoutSeconds: 2 }
          readinessProbe: { httpGet: { path: /readyz, port: management }, periodSeconds: 5, timeoutSeconds: 2 }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/agentvault, readOnly: true }
            - { name: runtime, mountPath: /run/agentvault }
            {{- if or (eq $provider "gcp") (eq $provider "aws") }}
            - name: csi-secrets
              mountPath: {{ include "agentvault.csiSecretsMountPath" . }}
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap: { name: {{ include "agentvault.fullname" . }}-config }
        - name: runtime
          emptyDir: {}
        {{- if or (eq $provider "gcp") (eq $provider "aws") }}
        - name: csi-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ printf "%s-%s-secrets" (include "agentvault.fullname" .) $provider }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml . | nindent 8 }}
      {{- end }}
