[package]
name = "quantstream-ingestor-rust"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
autotests = false

[dependencies]
agentvault-sdk = { path = "../../../../../src/adapters/rust" }
axum = "0.8"
futures = "0.3"
http = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
reqwest-middleware = "0.4"
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-streamable-http-client"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1.0"
sse-stream = "0.2"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-cron-scheduler = "0.14"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
