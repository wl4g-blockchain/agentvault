workload:
  kind: Deployment
  replicas: 1
  backoffLimit: 0
  restartPolicy: Always
image:
  repository: "marketpulse-typescript-e2e"
  tag: "local"
  pullPolicy: IfNotPresent
command: []
args: []
env:
  MARKETPULSE_BIND: "0.0.0.0:8081"
  AGENTVAULT_URL: "http://agentvault-e2e:8080/api/v1"
  MARKETPULSE_SCENARIO_ID: "scenario-marketpulse-feed"
  MARKETPULSE_OFFER_ID: "offer-realtime-news"
  MARKETPULSE_RESOURCE_URL: "http://marketpulse-typescript:8081/mcp"
  MARKETPULSE_ORIGIN: "http://marketpulse-typescript:8081"
  MARKETPULSE_DATABASE: "/var/lib/marketpulse/marketpulse.sqlite3"
  MARKETPULSE_E2E_ALLOW_FAILURE_INJECTION: "true"
secret:
  name: marketpulse-typescript-e2e-secrets
  env: {}
ports:
  - { name: http, containerPort: 8081, servicePort: 8081 }
service:
  enabled: true
probe:
  enabled: true
  type: http
  path: "/healthz"
  port: 8081
  initialDelaySeconds: 5
  periodSeconds: 5
config:
  enabled: false
  key: config
  mountPath: "/etc/component/config"
  content: |
    
persistence:
  enabled: true
  mountPath: "/var/lib/marketpulse"
resources:
  requests: { cpu: 20m, memory: 32Mi }
  limits: { cpu: 1000m, memory: 512Mi }
