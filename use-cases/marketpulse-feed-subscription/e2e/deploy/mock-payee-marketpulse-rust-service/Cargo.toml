[package]
name = "mock-payee-marketpulse-rust-service"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
autotests = false

[dependencies]
agentvault-sdk = { path = "../../../../../src/adapters/rust" }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
