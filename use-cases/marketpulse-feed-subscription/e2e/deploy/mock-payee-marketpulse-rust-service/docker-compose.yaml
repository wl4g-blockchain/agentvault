services:
  marketpulse-rust:
    image: ${E2E_MARKETPULSE_RUST_IMAGE:-marketpulse-rust-e2e:local}
    build:
      context: ${E2E_MARKETPULSE_REPOSITORY_ROOT:-../../../../..}
      dockerfile: use-cases/marketpulse-feed-subscription/e2e/deploy/mock-payee-marketpulse-rust-service/Dockerfile
      network: host
      args:
        HTTPS_PROXY: ${E2E_MARKETPULSE_BUILD_HTTPS_PROXY:-}
        HTTP_PROXY: ${E2E_MARKETPULSE_BUILD_HTTP_PROXY:-}
        NO_PROXY: ${E2E_MARKETPULSE_BUILD_NO_PROXY:-127.0.0.1,localhost}
        E2E_MARKETPULSE_RUST_BUILD_IMAGE: ${E2E_MARKETPULSE_RUST_BUILD_IMAGE:-registry.cn-shenzhen.aliyuncs.com/wl4g/authguard-rust-builder:1.94-bookworm}
        E2E_MARKETPULSE_RUST_RUNTIME_IMAGE: ${E2E_MARKETPULSE_RUST_RUNTIME_IMAGE:-gcr.io/distroless/cc-debian12:nonroot}
    environment:
      MARKETPULSE_BIND: ${E2E_MARKETPULSE_BIND:-0.0.0.0:8081}
      AGENTVAULT_TRANSPORT: ${E2E_AGENTVAULT_TRANSPORT:-mqtt}
      AGENTVAULT_GRPC_ENDPOINT: ${E2E_MARKETPULSE_GRPC_ENDPOINT:-agentvault:443}
      AGENTVAULT_GRPC_TLS: ${E2E_MARKETPULSE_GRPC_TLS:-true}
      AGENTVAULT_GRPC_TIMEOUT_SECONDS: ${E2E_MARKETPULSE_GRPC_TIMEOUT_SECONDS:-15}
      AGENTVAULT_MQTT_HOST: ${E2E_MARKETPULSE_MQTT_HOST:-emqx}
      AGENTVAULT_MQTT_PORT: ${E2E_MARKETPULSE_MQTT_PORT:-8883}
      AGENTVAULT_MQTT_TLS: ${E2E_MARKETPULSE_MQTT_TLS:-true}
      AGENTVAULT_MQTT_USERNAME: ${E2E_MARKETPULSE_MQTT_USERNAME:-marketpulse-payee}
      AGENTVAULT_MQTT_PASSWORD: ${E2E_MARKETPULSE_MQTT_PASSWORD:-replace-me}
      AGENTVAULT_MQTT_CLIENT_ID: ${E2E_MARKETPULSE_MQTT_CLIENT_ID:-client-marketpulse}
      AGENTVAULT_MQTT_TIMEOUT_SECONDS: ${E2E_MARKETPULSE_MQTT_TIMEOUT_SECONDS:-15}
      MARKETPULSE_SCENARIO_ID: ${E2E_MARKETPULSE_SCENARIO_ID:-scenario-marketpulse-feed}
      MARKETPULSE_OFFER_ID: ${E2E_MARKETPULSE_OFFER_ID:-offer-realtime-news}
      MARKETPULSE_RESOURCE_URL: ${E2E_MARKETPULSE_RESOURCE_URL:-http://marketpulse-rust:8081/mcp}
      MARKETPULSE_ORIGIN: ${E2E_MARKETPULSE_ORIGIN:-http://marketpulse-rust:8081}
      MARKETPULSE_DATABASE: ${E2E_MARKETPULSE_DATABASE:-/var/lib/marketpulse/marketpulse.sqlite3}
      MARKETPULSE_E2E_ALLOW_FAILURE_INJECTION: "${E2E_MARKETPULSE_ALLOW_FAILURE_INJECTION:-true}"
    ports: ["127.0.0.1:${E2E_MARKETPULSE_RUST_PORT:-38081}:8081"]
    volumes: ["marketpulse-rust-data:/var/lib/marketpulse"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/mock-payee-marketpulse-rust-service", "--healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  marketpulse-rust-data: {}
