apiVersion: v1
kind: ConfigMap
metadata:
  name: loopback-bridge
  namespace: e2e-agentvault-mock-payer
  labels:
    app.kubernetes.io/name: loopback-bridge
    app.kubernetes.io/component: mock-payer-transport
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: mqtt
          address: { socket_address: { address: 127.0.0.1, port_value: 1883 } }
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: mqtt
                    cluster: mqtt
        - name: agentvault_http
          address: { socket_address: { address: 127.0.0.1, port_value: 8080 } }
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: agentvault_http
                    cluster: agentvault_http
        - name: agentvault_grpc
          address: { socket_address: { address: 127.0.0.1, port_value: 50051 } }
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: agentvault_grpc
                    cluster: agentvault_grpc
      clusters:
        - name: mqtt
          type: STRICT_DNS
          connect_timeout: 3s
          load_assignment:
            cluster_name: mqtt
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: emqx.e2e-agentvault-infra-system.svc.cluster.local
                          port_value: 1883
        - name: agentvault_http
          type: STRICT_DNS
          connect_timeout: 3s
          load_assignment:
            cluster_name: agentvault_http
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: agentvault.e2e-agentvault-system.svc.cluster.local
                          port_value: 8080
        - name: agentvault_grpc
          type: STRICT_DNS
          connect_timeout: 3s
          load_assignment:
            cluster_name: agentvault_grpc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: agentvault.e2e-agentvault-system.svc.cluster.local
                          port_value: 50051
