workload:
  kind: Deployment
  replicas: 1
  backoffLimit: 0
  restartPolicy: Always
image:
  repository: "quantstream-admin-ui-e2e"
  tag: "local"
  pullPolicy: IfNotPresent
command: []
args: []
env:
  QUANTSTREAM_UI_HOST: "0.0.0.0"
  QUANTSTREAM_UI_PORT: "8086"
  QUANTSTREAM_CLIENT_ID: "client-quantstream"
  QUANTSTREAM_SCENARIO_ID: "scenario-quantstream-market-ingestion"
  QUANTSTREAM_APPROVER_PRINCIPAL: "principal-quantstream-admin"
  AGENTVAULT_MQTT_URL: "mqtt://emqx:1883"
  AGENTVAULT_URL: "http://agentvault-e2e:8080/api/v1"
secret:
  name: marketpulse-e2e-secrets
  env:
    QUANTSTREAM_ADMIN_UI_TOKEN: "admin-ui-token"
    AGENTVAULT_MQTT_APPROVER_PASSWORD: "mqtt-approver-password"
ports:
  - { name: http, containerPort: 8086, servicePort: 8086 }
service:
  enabled: true
probe:
  enabled: true
  type: http
  path: "/healthz"
  port: 8086
  initialDelaySeconds: 5
  periodSeconds: 5
config:
  enabled: false
  key: config
  mountPath: "/etc/component/config"
  content: |
    
persistence:
  enabled: false
  mountPath: "/var/lib/component"
resources:
  requests: { cpu: 20m, memory: 32Mi }
  limits: { cpu: 1000m, memory: 512Mi }

