%% AgentVault server: receive commands for registered clients and publish results/events.
{allow, {username, "agentvault-vault"}, subscribe, [
  "agentvault/v1/clients/+/commands/authorize",
  "agentvault/v1/clients/+/commands/outbound-response",
  "agentvault/v1/clients/+/commands/resolve-offer",
  "agentvault/v1/clients/+/commands/create-challenge",
  "agentvault/v1/clients/+/commands/verify-payment",
  "agentvault/v1/clients/+/commands/settle-payment",
  "agentvault/v1/clients/+/approvers/+/decisions"
]}.
{allow, {username, "agentvault-vault"}, publish, [
  "agentvault/v1/clients/+/results/+",
  "agentvault/v1/clients/+/approvals/required",
  "agentvault/v1/clients/+/approvers/+/results/+",
  "agentvault/v1/clients/+/payments/events/+"
]}.

%% QuantStream workload is pinned to its own registered client topic tree.
{allow, {username, "quantstream-workload"}, publish, [
  "agentvault/v1/clients/client-quantstream/commands/authorize",
  "agentvault/v1/clients/client-quantstream/commands/outbound-response"
]}.
{allow, {username, "quantstream-workload"}, subscribe, [
  "agentvault/v1/clients/client-quantstream/results/+",
  "agentvault/v1/clients/client-quantstream/approvals/required",
  "agentvault/v1/clients/client-quantstream/payments/events/+"
]}.

%% Approval decisions use an independent business administrator credential.
{allow, {username, "quantstream-approver"}, publish, [
  "agentvault/v1/clients/client-quantstream/approvers/principal-quantstream-admin/decisions"
]}.
{allow, {username, "quantstream-approver"}, subscribe, [
  "agentvault/v1/clients/client-quantstream/approvals/required",
  "agentvault/v1/clients/client-quantstream/approvers/principal-quantstream-admin/results/+"
]}.

{deny, all}.
