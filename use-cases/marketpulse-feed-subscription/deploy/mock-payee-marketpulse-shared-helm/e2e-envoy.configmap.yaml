apiVersion: v1
kind: ConfigMap
metadata:
  name: local-envoy-cm
  namespace: e2e-agentvault-mock-payee
  labels:
    app.kubernetes.io/name: local-envoy-cm
    app.kubernetes.io/component: mock-payee-transport
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: agentvault_http
        address:
          socket_address:
            address: 127.0.0.1
            port_value: 8080
        filter_chains:
        - filters:
          - name: envoy.filters.network.tcp_proxy
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
              stat_prefix: agentvault_http
              cluster: agentvault_http
      clusters:
      - name: agentvault_http
        type: STRICT_DNS
        connect_timeout: 3s
        load_assignment:
          cluster_name: agentvault_http
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: agentvault.e2e-agentvault-system.svc.cluster.local
                    port_value: 8080
