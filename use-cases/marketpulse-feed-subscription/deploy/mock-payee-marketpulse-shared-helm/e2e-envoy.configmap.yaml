apiVersion: v1
kind: ConfigMap
metadata:
  name: local-envoy-cm
  namespace: e2e-agentvault-mock-payee
  labels:
    app.kubernetes.io/name: local-envoy-cm
    app.kubernetes.io/component: mock-payee-transport
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: mqtt
          address: { socket_address: { address: 127.0.0.1, port_value: 1883 } }
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: mqtt
                    cluster: mqtt
        - name: grpc
          address: { socket_address: { address: 127.0.0.1, port_value: 50051 } }
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: grpc
                    cluster: grpc
      clusters:
        - name: mqtt
          type: STRICT_DNS
          connect_timeout: 3s
          load_assignment:
            cluster_name: mqtt
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: emqx.e2e-agentvault-infra-system.svc.cluster.local
                          port_value: 1883
        - name: grpc
          type: STRICT_DNS
          connect_timeout: 3s
          http2_protocol_options: {}
          load_assignment:
            cluster_name: grpc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: agentvault.e2e-agentvault-system.svc.cluster.local
                          port_value: 50051
