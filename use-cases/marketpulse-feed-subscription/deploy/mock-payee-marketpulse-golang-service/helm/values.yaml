workload:
  kind: Deployment
  replicas: 1
  backoffLimit: 0
  restartPolicy: Always
image:
  repository: ""
  tag: ""
  pullPolicy: Never
command: []
args: []
env:
  AGENTVAULT_HTTP_BASE_URL: "http://127.0.0.1:8080"
  AGENTVAULT_HTTP_TIMEOUT_SECONDS: "15"
  MARKETPULSE_BIND: "0.0.0.0:8081"
  AGENTVAULT_TRANSPORT: "http"
  MARKETPULSE_SCENARIO_ID: "scenario-marketpulse-feed"
  MARKETPULSE_PRICE_ID: "price-realtime-news"
  MARKETPULSE_RESOURCE_URL: "http://marketpulse-golang:8081/mcp"
  MARKETPULSE_ORIGIN: "http://marketpulse-golang:8081"
  MARKETPULSE_DATABASE: "/var/lib/marketpulse/marketpulse.sqlite3"
  MARKETPULSE_E2E_ALLOW_FAILURE_INJECTION: "true"
secret:
  name: marketpulse-golang-e2e-secrets
  env:
ports:
  - { name: http, containerPort: 8081, servicePort: 8081 }
service:
  enabled: true
probe:
  enabled: true
  type: http
  path: "/healthz"
  port: 8081
  initialDelaySeconds: 5
  periodSeconds: 5
config:
  enabled: false
  key: config
  mountPath: "/etc/component/config"
  content: |
    
persistence:
  existingClaim: ""
  enabled: true
  mountPath: "/var/lib/marketpulse"
resources:
  requests: { cpu: 20m, memory: 32Mi }
  limits: { cpu: 1000m, memory: 512Mi }
