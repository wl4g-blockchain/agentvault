apiVersion: v1
kind: ConfigMap
metadata:
  name: agentvault-local-envoy-cm
  namespace: e2e-agentvault-system
  labels:
    app.kubernetes.io/name: agentvault
    app.kubernetes.io/component: e2e-local-envoy-cm
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: mqtt
          address: { socket_address: { address: 127.0.0.1, port_value: 1883 } }
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: mqtt
                    cluster: mqtt
        - name: anvil
          address: { socket_address: { address: 127.0.0.1, port_value: 8545 } }
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: anvil
                    cluster: anvil
        - name: facilitator
          address: { socket_address: { address: 127.0.0.1, port_value: 8085 } }
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: facilitator
                    cluster: facilitator
        - name: otlp
          address: { socket_address: { address: 127.0.0.1, port_value: 4317 } }
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: otlp
                    cluster: otlp
      clusters:
        - name: mqtt
          type: STRICT_DNS
          connect_timeout: 3s
          load_assignment:
            cluster_name: mqtt
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: emqx.e2e-agentvault-infra-system.svc.cluster.local
                          port_value: 1883
        - name: anvil
          type: STRICT_DNS
          connect_timeout: 3s
          load_assignment:
            cluster_name: anvil
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: anvil.e2e-agentvault-payment-system.svc.cluster.local
                          port_value: 8545
        - name: facilitator
          type: STRICT_DNS
          connect_timeout: 3s
          load_assignment:
            cluster_name: facilitator
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: x402-facilitator.e2e-agentvault-payment-system.svc.cluster.local
                          port_value: 8085
        - name: otlp
          type: STRICT_DNS
          connect_timeout: 3s
          load_assignment:
            cluster_name: otlp
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: jaeger.e2e-agentvault-infra-system.svc.cluster.local
                          port_value: 4317
