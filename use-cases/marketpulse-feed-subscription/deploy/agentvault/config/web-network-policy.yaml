apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentvault-web-health
  namespace: e2e-agentvault-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: agentvault
      app.kubernetes.io/component: server
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: agentvault
              app.kubernetes.io/component: web
      ports: [{ protocol: TCP, port: 9091 }]
