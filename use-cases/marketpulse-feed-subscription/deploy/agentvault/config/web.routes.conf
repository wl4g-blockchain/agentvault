# Private E2E routes only; public installations use their authenticated gateway.
location /api/v1/ {
  proxy_pass http://__API_UPSTREAM__;
  proxy_connect_timeout 5s;
  proxy_read_timeout 20s;
}
location = /agentvault-management/healthz {
  proxy_pass http://__MANAGEMENT_UPSTREAM__/healthz;
}
location = /agentvault-management/readyz {
  proxy_pass http://__MANAGEMENT_UPSTREAM__/readyz;
}
location /agentvault-management/ {
  return 404;
}
