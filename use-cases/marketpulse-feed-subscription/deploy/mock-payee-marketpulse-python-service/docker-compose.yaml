services:
  marketpulse-python:
    image: ${E2E_MARKETPULSE_PYTHON_IMAGE:?required}
    platform: ${E2E_IMAGE_PLATFORM:?required}
    build:
      context: ${E2E_MARKETPULSE_REPOSITORY_ROOT:-../../../..}
      dockerfile: use-cases/marketpulse-feed-subscription/deploy/mock-payee-marketpulse-python-service/Dockerfile
      args:
        BUILDKIT_SYNTAX: ${BUILDKIT_SYNTAX:?required}
        HTTPS_PROXY: ${E2E_MARKETPULSE_BUILD_HTTPS_PROXY:-}
        HTTP_PROXY: ${E2E_MARKETPULSE_BUILD_HTTP_PROXY:-}
        NO_PROXY: ${E2E_MARKETPULSE_BUILD_NO_PROXY:-127.0.0.1,localhost}
        E2E_MARKETPULSE_PYTHON_BUILD_IMAGE: ${E2E_MARKETPULSE_PYTHON_BUILD_IMAGE:?required}
        E2E_MARKETPULSE_PYTHON_RUNTIME_IMAGE: ${E2E_MARKETPULSE_PYTHON_RUNTIME_IMAGE:?required}
    environment:
      AGENTVAULT_HTTP_BASE_URL: ${AGENTVAULT_HTTP_BASE_URL:-http://127.0.0.1:8080}
      AGENTVAULT_HTTP_TIMEOUT_SECONDS: "15"
      MARKETPULSE_BIND: ${E2E_MARKETPULSE_BIND:-0.0.0.0:8081}
      AGENTVAULT_TRANSPORT: http
      MARKETPULSE_SCENARIO_ID: ${E2E_MARKETPULSE_SCENARIO_ID:-scenario-marketpulse-feed}
      MARKETPULSE_PRICE_ID: ${E2E_MARKETPULSE_PRICE_ID:-price-realtime-news}
      MARKETPULSE_RESOURCE_URL: ${E2E_MARKETPULSE_RESOURCE_URL:-http://marketpulse-python:8081/mcp}
      MARKETPULSE_ORIGIN: ${E2E_MARKETPULSE_ORIGIN:-http://marketpulse-python:8081}
      MARKETPULSE_DATABASE: ${E2E_MARKETPULSE_DATABASE:-/var/lib/marketpulse/marketpulse.sqlite3}
      MARKETPULSE_E2E_ALLOW_FAILURE_INJECTION: ${E2E_MARKETPULSE_ALLOW_FAILURE_INJECTION:-true}
    ports: ["127.0.0.1:${E2E_MARKETPULSE_PYTHON_PORT:-38083}:8081"]
    volumes: ["marketpulse-python-data:/var/lib/marketpulse"]
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz')"], interval: 3s, timeout: 3s, retries: 30 }
volumes:
  marketpulse-python-data: {}
