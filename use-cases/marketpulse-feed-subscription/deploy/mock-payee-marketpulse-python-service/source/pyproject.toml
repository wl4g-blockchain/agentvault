[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mock-payee-marketpulse-python-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["a2a-sdk==0.3.26", "agentvault-sdk==0.1.0", "fastapi>=0.119,<1", "uvicorn>=0.37,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
