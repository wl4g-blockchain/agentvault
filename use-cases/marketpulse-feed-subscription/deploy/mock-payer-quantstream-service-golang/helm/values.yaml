workload:
  kind: Job
  replicas: 1
  backoffLimit: 0
  restartPolicy: Never
image:
  repository: ""
  tag: ""
  pullPolicy: Never
command: []
args:
  - "--once"
env:
  AGENTVAULT_HTTP_BASE_URL: "http://127.0.0.1:8080"
  AGENTVAULT_HTTP_TIMEOUT_SECONDS: "15"
  MARKETPULSE_URL: "http://marketpulse:8081/mcp"
  QUANTSTREAM_CLIENT_ID: "client-quantstream-go"
  QUANTSTREAM_SCENARIO_ID: "scenario-quantstream-go-market-ingestion"
  QUANTSTREAM_DATABASE: "/var/lib/quantstream/ingestion.sqlite3"
secret:
  name: marketpulse-e2e-secrets
  env:
ports: []
service:
  enabled: false
probe:
  enabled: false
  type: tcp
  path: "/"
  port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
config:
  enabled: false
  key: config
  mountPath: "/etc/component/config"
  content: |
    
persistence:
  existingClaim: ""
  enabled: true
  mountPath: "/var/lib/quantstream"
resources:
  requests: { cpu: 20m, memory: 32Mi }
  limits: { cpu: 1000m, memory: 512Mi }
