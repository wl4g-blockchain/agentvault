[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentvault-sdk"
version = "0.1.0"
description = "Python SDK for the AgentVault payment API"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk==0.3.26",
    "httpx>=0.28,<1",
    "pympp[mcp]==0.14.0",
    "x402==2.25.0",
]

[project.optional-dependencies]
test = []

[tool.setuptools.packages.find]
where = ["."]
include = ["agentvault*"]
