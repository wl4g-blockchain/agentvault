[package]
name = "agentvault-sdk"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Transport-neutral Rust SDK for AgentVault payment APIs"
rust-version = "1.91"

[dependencies]
a2a-types = "=0.1.3"
uuid = { version = "1.18", features = ["v4"] }
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
http = "1.3"
mpp = { version = "=0.15.1", default-features = false }
prost = "0.14"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
reqwest-middleware = "0.4"
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tokio = { version = "1.47", features = ["rt", "sync", "time"] }
tonic = { version = "0.14", features = ["transport", "tls-webpki-roots"] }
tonic-prost = "0.14"
tower = "0.5"
tracing = "0.1"
time = { version = "0.3", features = ["formatting"] }
x402-types = "=1.4.11"
x402-chain-eip155 = { version = "=1.4.11", default-features = false }
x402-chain-solana = { version = "=1.4.11", default-features = false }
zeroize = "1.8"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
