[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentvault-sdk"
version = "0.1.0"
description = "Python SDK for the AgentVault payment API"
requires-python = ">=3.10"
dependencies = ["grpcio>=1.76,<2", "httpx>=0.28,<1", "paho-mqtt>=2.1,<3", "protobuf>=6.32,<7"]

[project.optional-dependencies]
test = []

[tool.setuptools.packages.find]
where = ["."]
include = ["agentvault*"]
