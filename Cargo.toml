[package]
name = "agentvault"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Process-isolated EOA custody and AI-agent payment infrastructure"
rust-version = "1.91"

[lib]
name = "agentvault"
path = "src/lib.rs"

[[bin]]
name = "agentvault"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
aes-gcm = "0.10"
alloy-primitives = "1.4"
alloy-sol-types = "1.4"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bigdecimal = "0.4"
clap = { version = "4.5", features = ["derive"] }
config = { version = "0.15", default-features = false, features = ["convert-case", "yaml"] }
hex = "0.4"
hmac = "0.12"
humantime-serde = "1.1"
k256 = { version = "0.13", features = ["ecdsa"] }
jsonwebtoken = { version = "9.3", default-features = false }
libc = "0.2"
mpp = { version = "0.15.1", default-features = false }
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
prometheus-client = "0.25"
prost = "0.14"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
redis = { version = "=1.2.2", default-features = false, features = ["cluster-async", "tokio-rustls-comp"] }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "bigdecimal", "json"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
zeroize = "1.8"
x402-chain-eip155 = { version = "=1.4.11", features = ["client"] }
x402-types = "=1.4.11"

[dev-dependencies]
tempfile = "3.21"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
