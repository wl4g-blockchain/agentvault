name: Pull Request

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: agentvault-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting
        run: make fmt-check

      - name: Run Clippy
        run: make lint

      - name: Run unit tests
        run: make test

      - name: Run real-process use-case E2E
        run: make e2e

      - name: Build release binary
        run: make build
