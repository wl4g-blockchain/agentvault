name: Pull Request

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: agentvault-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      issues: write
      packages: write
      pull-requests: write
    outputs:
      dirty_tag: ${{ steps.dirty-tag.outputs.value }}
      dirty_chart_version: ${{ steps.dirty-tag.outputs.chart_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Update PR CI comment
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTVAULT_PR_NUMBER: ${{ github.event.pull_request.number }}
          AGENTVAULT_COMMENT_KIND: ci
          AGENTVAULT_COMMENT_PHASE: started
          AGENTVAULT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AGENTVAULT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node .github/scripts/upsert-pr-status-comment.mjs || \
            echo "::warning title=AgentVault PR CI comment::Could not publish the CI status comment."

      - name: Reclaim ephemeral runner disk
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
          tool-cache: true

      - name: Derive immutable dirty tag
        id: dirty-tag
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          short_sha="${HEAD_SHA:0:8}"
          base_chart_version=$(awk '/^version:/ { print $2; exit }' deploy/helm/agentvault/Chart.yaml)
          test -n "${base_chart_version}"
          echo "value=dirty-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${base_chart_version}-dirty.${short_sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dirty runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            BUILDER_IMAGE=docker.io/library/rust:1.91.1-bookworm
            RUNTIME_IMAGE=gcr.io/distroless/cc-debian12:nonroot
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.version=${{ steps.dirty-tag.outputs.value }}
          tags: ghcr.io/${{ github.repository_owner }}/agentvault:${{ steps.dirty-tag.outputs.value }}
          cache-from: type=gha,scope=agentvault-runtime-amd64
          cache-to: type=gha,mode=max,scope=agentvault-runtime-amd64,ignore-error=true

      - name: Build and push dirty web image
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            NODE_IMAGE=docker.io/library/node:22-alpine
            WEB_IMAGE=docker.io/nginxinc/nginx-unprivileged:1.27-alpine
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.version=${{ steps.dirty-tag.outputs.value }}
          tags: ghcr.io/${{ github.repository_owner }}/agentvault-web:${{ steps.dirty-tag.outputs.value }}
          cache-from: type=gha,scope=agentvault-web-amd64
          cache-to: type=gha,mode=max,scope=agentvault-web-amd64,ignore-error=true

      - name: Drop package credentials before tests
        run: docker logout ghcr.io

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            src/adapters/typescript/package-lock.json

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: src/adapters/golang/go.sum

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/adapters/python/pyproject.toml

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Verify root Rust crate
        run: |
          make fmt-check
          make lint
          CARGO_BUILD_JOBS=4 cargo test --all-targets --locked

      - name: Verify Rust SDK
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo fmt --manifest-path src/adapters/rust/Cargo.toml -- --check
          cargo clippy --manifest-path src/adapters/rust/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path src/adapters/rust/Cargo.toml --all-targets --locked

      - name: Verify Go SDK
        working-directory: src/adapters/golang
        run: |
          go test ./...
          go vet ./...

      - name: Verify Python SDK
        env:
          PYTHONPATH: ${{ github.workspace }}/src/adapters/python
        run: |
          python3 -m pip install --disable-pip-version-check --editable 'src/adapters/python[test]'
          for suite in tests/agentvault tests/agentvault/config tests/agentvault/model \
            tests/agentvault/payer tests/agentvault/payee tests/agentvault/transport; do
            python3 -m unittest discover -s "src/adapters/python/${suite}" -p '*_test.py' -v
          done
          python3 -m compileall -q src/adapters/python/agentvault

      - name: Verify TypeScript SDK
        working-directory: src/adapters/typescript
        run: |
          npm ci
          npm test
          npm run build

      - name: Verify Java SDK
        working-directory: src/adapters/java
        run: mvn -B test

      - name: Verify dashboard
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Verify E2E source and deployment contracts
        run: |
          python3 use-cases/marketpulse-feed-subscription/e2e/runner.py run \
            --scenario structure --scenario infrastructure --cleanup-after-run

      - name: Package dirty Helm chart
        env:
          CHART_VERSION: ${{ steps.dirty-tag.outputs.chart_version }}
          DIRTY_TAG: ${{ steps.dirty-tag.outputs.value }}
        run: |
          mkdir -p dist
          helm dependency list deploy/helm/agentvault
          helm lint deploy/helm/agentvault
          helm package deploy/helm/agentvault \
            --destination dist \
            --version "${CHART_VERSION}" \
            --app-version "${DIRTY_TAG}"
          helm show chart "dist/agentvault-${CHART_VERSION}.tgz" >/dev/null

      - name: Upload dirty Helm chart
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: agentvault-chart-${{ steps.dirty-tag.outputs.value }}
          path: dist/agentvault-${{ steps.dirty-tag.outputs.chart_version }}.tgz
          if-no-files-found: error
          retention-days: 14

  comment-build:
    name: Report build result
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Update PR CI comment
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTVAULT_PR_NUMBER: ${{ github.event.pull_request.number }}
          AGENTVAULT_COMMENT_KIND: ci
          AGENTVAULT_COMMENT_PHASE: build
          AGENTVAULT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AGENTVAULT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AGENTVAULT_BUILD_RESULT: ${{ needs.build-and-test.result }}
          AGENTVAULT_DIRTY_TAG: ${{ needs.build-and-test.outputs.dirty_tag }}
          AGENTVAULT_DIRTY_CHART_VERSION: ${{ needs.build-and-test.outputs.dirty_chart_version }}
        run: |
          node .github/scripts/upsert-pr-status-comment.mjs || \
            echo "::warning title=AgentVault PR CI comment::Could not publish the CI status comment."

  e2e-docker:
    name: Full MarketPulse Docker Compose E2E
    needs: build-and-test
    runs-on: ${{ vars.AGENTVAULT_E2E_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    outputs:
      summary_base64: ${{ steps.summary.outputs.base64 }}
      evidence_url: ${{ steps.evidence.outputs.artifact-url }}
    env:
      E2E_AGENTVAULT_IMAGE: ghcr.io/${{ github.repository_owner }}/agentvault:${{ needs.build-and-test.outputs.dirty_tag }}
      E2E_RUNNER_PREBUILT_AGENTVAULT: "1"
    steps:
      - name: Reclaim ephemeral runner disk
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
          tool-cache: true

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Verify Docker Compose
        run: docker compose version

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable dirty runtime
        run: docker pull "${E2E_AGENTVAULT_IMAGE}"

      - name: Run complete five-language E2E matrix
        run: |
          python3 use-cases/marketpulse-feed-subscription/e2e/runner.py run \
            --scenario matrix --reuse-build --cleanup-after-run --timeout 150m

      - name: Capture E2E summary
        id: summary
        if: always()
        run: |
          summary=$(find use-cases/marketpulse-feed-subscription/e2e/reports \
            -mindepth 2 -maxdepth 2 -name summary.md -printf '%T@ %p\n' \
            2>/dev/null | sort -nr | head -1 | cut -d' ' -f2- || true)
          if [[ -z "${summary}" || ! -s "${summary}" ]]; then
            echo "::error title=Missing E2E summary::The E2E job did not produce a non-empty summary.md."
            exit 1
          fi
          echo "base64=$(base64 -w 0 "${summary}")" >> "$GITHUB_OUTPUT"

      - name: Upload E2E evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketpulse-e2e-docker-${{ needs.build-and-test.outputs.dirty_tag }}
          path: use-cases/marketpulse-feed-subscription/e2e/reports/
          if-no-files-found: error
          retention-days: 14

  comment-final:
    name: Report PR CI result
    needs: [build-and-test, comment-build, e2e-docker]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Update PR CI comment
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTVAULT_PR_NUMBER: ${{ github.event.pull_request.number }}
          AGENTVAULT_COMMENT_KIND: ci
          AGENTVAULT_COMMENT_PHASE: final
          AGENTVAULT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AGENTVAULT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AGENTVAULT_BUILD_RESULT: ${{ needs.build-and-test.result }}
          AGENTVAULT_E2E_DOCKER_RESULT: ${{ needs.e2e-docker.result }}
          AGENTVAULT_E2E_DOCKER_SUMMARY_BASE64: ${{ needs.e2e-docker.outputs.summary_base64 }}
          AGENTVAULT_E2E_DOCKER_EVIDENCE_URL: ${{ needs.e2e-docker.outputs.evidence_url }}
          AGENTVAULT_DIRTY_TAG: ${{ needs.build-and-test.outputs.dirty_tag }}
          AGENTVAULT_DIRTY_CHART_VERSION: ${{ needs.build-and-test.outputs.dirty_chart_version }}
        run: |
          node .github/scripts/upsert-pr-status-comment.mjs || \
            echo "::warning title=AgentVault PR CI comment::Could not publish the CI status comment."
