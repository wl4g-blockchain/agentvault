name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

concurrency:
  group: agentvault-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  IMAGE: ghcr.io/wl4g-blockchain/agentvault

jobs:
  prepare:
    name: Prepare release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Determine semantic release version
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          head_tag=$(git tag --points-at "${MERGE_SHA}" -l 'v[0-9]*' --sort=-v:refname | head -1)
          if [[ -n "${head_tag}" ]]; then
            echo "version=${head_tag#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${head_tag}" >> "$GITHUB_OUTPUT"
            echo "short_sha=${MERGE_SHA:0:12}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          if grep -qiE '^[a-z]+(\([^)]+\))?!:' <<< "${PR_TITLE}"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -qiE '^feat(\([^)]+\))?:' <<< "${PR_TITLE}"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${MERGE_SHA:0:12}" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build release binary
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: make build

      - name: Package release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          package="agentvault-${VERSION}-linux-amd64"
          mkdir -p "dist/${package}/etc"
          install -m 0755 target/release/walletd "dist/${package}/walletd"
          install -m 0644 etc/agentvault.yaml "dist/${package}/etc/agentvault.yaml"
          install -m 0644 README.md README_ZH.md LICENSE "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          sha256sum "dist/${package}.tar.gz" > "dist/${package}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: agentvault-release-${{ needs.prepare.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish-image:
    name: Publish multi-architecture image
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable and latest tags
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.merge_commit_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ needs.prepare.outputs.short_sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=agentvault-runtime
          cache-to: type=gha,mode=max,scope=agentvault-runtime,ignore-error=true

  publish-release:
    name: Publish GitHub release
    needs: [prepare, build-release, publish-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: agentvault-release-${{ needs.prepare.outputs.version }}
          path: dist

      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          gh release create "${TAG}" dist/* \
            --target "${TARGET}" \
            --generate-notes \
            --title "AgentVault ${TAG}"
